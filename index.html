    function normalizeKey(str) {
      return String(str || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]/g, '');
    }

    function getFieldInsensitive(row, ...candidateKeys) {
      if (!row || typeof row !== 'object') return undefined;
      for (const k of candidateKeys) {
        if (row[k] !== undefined && row[k] !== null && row[k] !== '') {
          return row[k];
        }
      }
      const normalizedMap = {};
      Object.keys(row).forEach(actualKey => {
        const nk = normalizeKey(actualKey);
        if (!(nk in normalizedMap) && row[actualKey] !== undefined && row[actualKey] !== null && row[actualKey] !== '') {
          normalizedMap[nk] = row[actualKey];
        }
      });
      for (const k of candidateKeys) {
        const nk = normalizeKey(k);
        if (nk in normalizedMap) {
          return normalizedMap[nk];
        }
      }
      return undefined;
    }

    function fixDriveImageUrl(url) {
      if (!url || typeof url !== 'string') return url;
      const trimmed = url.trim();
      if (trimmed.startsWith('data:image/')) return trimmed;
      const matchId = trimmed.match(/(?:drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=view&)?id=|thumbnail\?id=))([a-zA-Z0-9_-]+)/);
      if (matchId && matchId[1]) {
        return `https://drive.google.com/thumbnail?id=${matchId[1]}&sz=w1000`;
      }
      return trimmed;
    }

    function slugify(text) {
      return String(text || 'tienda')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '') || 'tienda-' + Date.now();
    }

    // ==================== PLANTILLA REUTILIZABLE ====================
    function isTemplateStore(store) {
      if (!store) return false;
      return Boolean(
        store.esPlantillaDemo ||
        store.id === DEMO_TEMPLATE_ID ||
        String(store.email || '').trim().toLowerCase() === DEMO_TEMPLATE_EMAIL
      );
    }

    function ensureDemoTemplateExists() {
      const todayISO = new Date().toISOString().split('T')[0];
      const existingIdx = db.tiendas.findIndex(t => t.id === DEMO_TEMPLATE_ID);
      if (existingIdx === -1) {
        db.tiendas.unshift(createDemoTemplateStore(todayISO));
      } else {
        const current = db.tiendas[existingIdx];
        db.tiendas[existingIdx] = {
          ...createDemoTemplateStore(todayISO),
          ...current,
          id: DEMO_TEMPLATE_ID,
          slug: 'plantilla-emprendedor-demo',
          email: DEMO_TEMPLATE_EMAIL,
          password: DEMO_TEMPLATE_PASS,
          esPlantillaDemo: true,
          estadoSuscripcion: 'ACTIVA'
        };
      }

      const templateProds = db.productos.filter(p => p.tiendaId === DEMO_TEMPLATE_ID);
      if (templateProds.length === 0) {
        db.productos = [...createDemoTemplateProducts(), ...db.productos];
      }
    }

    function restoreDemoTemplate() {
      const todayISO = new Date().toISOString().split('T')[0];
      const freshTemplate = createDemoTemplateStore(todayISO);
      const freshProds = createDemoTemplateProducts();

      db.tiendas = db.tiendas.filter(t => t.id !== DEMO_TEMPLATE_ID);
      db.tiendas.unshift(freshTemplate);

      db.productos = db.productos.filter(p => p.tiendaId !== DEMO_TEMPLATE_ID);
      db.productos = [...freshProds, ...db.productos];

      db.ofertas = db.ofertas.filter(o => o.id !== 'of-plantilla-1' && o.productoId !== 'prod-plantilla-1');
      db.ofertas.unshift({
        id: 'of-plantilla-1',
        productoId: 'prod-plantilla-1',
        precioOferta: 14500,
        hastaCuando: Date.now() + 4 * 60 * 60 * 1000,
        destacada: false
      });

      if (ui.session && ui.session.role === 'VENDOR' && ui.session.storeId === DEMO_TEMPLATE_ID) {
        ui.showProductForm = false;
        ui.productFormDraft = null;
      }

      saveState(db);
      showToast('Plantilla de demostración restaurada y lista para usar.', 'success');
      render();
    }

    function materializeOwnStoreFromTemplate(templateStore, newFields) {
      const newEmail = String(newFields.email || '').trim().toLowerCase();
      const newPass = String(newFields.password || '').trim();
      const newName = String(newFields.nombre || '').trim().toUpperCase();

      const credentialsChanged =
        (newEmail && newEmail !== DEMO_TEMPLATE_EMAIL) ||
        (newPass && newPass !== DEMO_TEMPLATE_PASS);

      const identityChanged =
        (newName && newName !== templateStore.nombre) ||
        (String(newFields.whatsapp || '').trim() && String(newFields.whatsapp || '').trim() !== templateStore.whatsapp) ||
        (String(newFields.rubro || '').trim() && String(newFields.rubro || '').trim() !== templateStore.rubro);

      if (!credentialsChanged && !identityChanged) {
        return { cloned: false, store: templateStore };
      }

      const ownId = 'tienda-' + Date.now();
      const baseSlug = slugify(newName || templateStore.nombre || 'mi-tienda');
      const uniqueSlug = db.tiendas.some(t => t.slug === baseSlug)
        ? `${baseSlug}-${Math.floor(10 + Math.random() * 89)}`
        : baseSlug;

      const ownStore = {
        ...templateStore,
        ...newFields,
        id: ownId,
        slug: uniqueSlug,
        esPlantillaDemo: false,
        dueno: newName ? newName.charAt(0) + newName.slice(1).toLowerCase() : templateStore.dueno,
        email: newEmail || DEMO_TEMPLATE_EMAIL,
        password: newPass || DEMO_TEMPLATE_PASS,
        nombre: newName || templateStore.nombre,
        antiguedadTexto: 'Nueva tienda en Tres Arroyos',
        fechaRegistro: new Date().toISOString().split('T')[0],
        estadoSuscripcion: 'ACTIVA'
      };

      const currentTemplateProds = db.productos.filter(p => p.tiendaId === DEMO_TEMPLATE_ID);
      const idMap = new Map();
      const clonedProds = currentTemplateProds.map((p, idx) => {
        const newProdId = `prod-${Date.now()}-${idx}`;
        idMap.set(p.id, newProdId);
        return {
          ...p,
          id: newProdId,
          tiendaId: ownId,
          categoria: ownStore.rubro || p.categoria,
          fotos: Array.isArray(p.fotos) ? [...p.fotos] : [SAMPLE_FALLBACK_PHOTO]
        };
      });

      const clonedOffers = db.ofertas
        .filter(o => idMap.has(o.productoId))
        .map((o, idx) => ({
          ...o,
          id: `of-${Date.now()}-${idx}`,
          productoId: idMap.get(o.productoId)
        }));

      const clonedOrders = db.pedidos
        .filter(o => o.tiendaId === DEMO_TEMPLATE_ID)
        .map((o, idx) => ({
          ...o,
          id: `PED-${Math.floor(2000 + Math.random() * 7999)}-${idx}`,
          tiendaId: ownId,
          tiendaNombre: ownStore.nombre
        }));

      const freshTemplate = createDemoTemplateStore(new Date().toISOString().split('T')[0]);
      const freshTemplateProds = createDemoTemplateProducts();

      db.tiendas = [
        freshTemplate,
        ownStore,
        ...db.tiendas.filter(t => t.id !== DEMO_TEMPLATE_ID)
      ];

      db.productos = [
        ...freshTemplateProds,
        ...clonedProds,
        ...db.productos.filter(p => p.tiendaId !== DEMO_TEMPLATE_ID)
      ];

      db.ofertas = [
        {
          id: 'of-plantilla-1',
          productoId: 'prod-plantilla-1',
          precioOferta: 14500,
          hastaCuando: Date.now() + 4 * 60 * 60 * 1000,
          destacada: false
        },
        ...clonedOffers,
        ...db.ofertas.filter(o => !idMap.has(o.productoId) && o.id !== 'of-plantilla-1')
      ];

      db.pedidos = [
        ...clonedOrders,
        ...db.pedidos.filter(o => o.tiendaId !== DEMO_TEMPLATE_ID)
      ];

      ui.session = { role: 'VENDOR', storeId: ownId };
      saveState(db);
      syncStoreToSheet(ownStore);
      if (clonedProds[0]) syncProductToSheet(clonedProds[0]);

      return { cloned: true, store: ownStore };
    }

    // ==================== INTEGRACIÓN GOOGLE SHEETS (APPS SCRIPT) ====================
    function parseBool(val, fallback = false) {
      if (typeof val === 'boolean') return val;
      if (typeof val === 'number') return val !== 0;
      if (typeof val === 'string') {
        const s = val.trim().toLowerCase();
        if (s === 'true' || s === '1' || s === 'sí' || s === 'si') return true;
        if (s === 'false' || s === '0' || s === 'no') return false;
      }
      return fallback;
    }

    function parseListField(val, fallback = []) {
      if (Array.isArray(val)) return val;
      if (typeof val === 'string' && val.trim()) {
        try {
          const parsed = JSON.parse(val);
          if (Array.isArray(parsed)) return parsed;
        } catch (_) {}
        return val.split(',').map(s => s.trim()).filter(Boolean);
      }
      return fallback;
    }

    function normalizeSheetStore(row) {
      const rawId = getFieldInsensitive(row, 'ID', 'id');
      const rawNombre = getFieldInsensitive(row, 'Nombre', 'nombre', 'Tienda', 'tienda');
      if (!rawId && !rawNombre) return null;

      const nombre = String(rawNombre || 'Tienda local').trim();
      const id = String(rawId || ('tienda-' + slugify(nombre))).trim();
      const estadoRaw = String(getFieldInsensitive(row, 'Estado Plan', 'Estado', 'estadoSuscripcion', 'estado') || 'ACTIVA').trim().toUpperCase();
      const envioRaw = getFieldInsensitive(row, 'Envío', 'Envio', 'envio', 'haceEnvios');
      const metodosRaw = getFieldInsensitive(row, 'Métodos pago', 'Metodos pago', 'MetodosPago', 'metodosPago', 'metodospago');
      const fechaRaw = getFieldInsensitive(row, 'Fecha registro', 'FechaRegistro', 'fecharegistro', 'fechaRegistro');
      const verifRaw = getFieldInsensitive(row, 'Verificado', 'verificado');
      const abiertoRaw = getFieldInsensitive(row, 'Abierto', 'abierto', 'abiertoAhora');
      const passRaw = getFieldInsensitive(row, 'Contraseña', 'Contrasena', 'password', 'Clave');

      return {
        id,
        slug: String(getFieldInsensitive(row, 'Slug', 'slug') || slugify(nombre)),
        nombre,
        dueno: String(getFieldInsensitive(row, 'Dueño', 'Dueno', 'dueno') || nombre).trim(),
        email: String(getFieldInsensitive(row, 'Email', 'email', 'Correo', 'correo') || '').trim().toLowerCase(),
        password: passRaw !== undefined && passRaw !== null ? String(passRaw).replace(/^'/, '').trim() : '',
        esPlantillaDemo: id === DEMO_TEMPLATE_ID,
        rubro: String(getFieldInsensitive(row, 'Rubro', 'rubro', 'Categoría', 'Categoria') || 'Otros').trim(),
        barrio: String(getFieldInsensitive(row, 'Barrio', 'barrio') || 'Centro').trim(),
        direccion: String(getFieldInsensitive(row, 'Dirección', 'Direccion', 'direccion') || '').trim(),
        whatsapp: String(getFieldInsensitive(row, 'WhatsApp', 'Whatsapp', 'whatsapp', 'Telefono', 'Teléfono') || '').trim(),
        instagram: String(getFieldInsensitive(row, 'Instagram', 'instagram') || '').trim(),
        logo: fixDriveImageUrl(String(getFieldInsensitive(row, 'Logo', 'logo') || '').trim()) || makeSvgFallbackDataUri(nombre, '#1A2A44'),
        portada: fixDriveImageUrl(String(getFieldInsensitive(row, 'Portada', 'portada') || '').trim()) || makeSvgFallbackDataUri(nombre, '#2E7D32'),
        descripcion: String(getFieldInsensitive(row, 'Descripción', 'Descripcion', 'descripcion') || '').trim(),

        fiveStarCount: Number(getFieldInsensitive(row, 'FiveStarCount', 'fiveStarCount')) || 0,
        salesCount: Number(getFieldInsensitive(row, 'Ventas', 'salesCount')) || 1,
        verificado: parseBool(verifRaw, false),
        abiertoAhora: parseBool(abiertoRaw, true),
        horarioTexto: String(getFieldInsensitive(row, 'Horarios', 'Horarios', 'horarioTexto') || 'Lun a Sáb 9 a 20').trim(),
        haceEnvios: parseBool(envioRaw, true),

        envioGratisDesde: Number(getFieldInsensitive(row, 'EnvioGratisDesde', 'Envío gratis desde', 'envioGratisDesde')) || 0,
        aceptaEncargo: parseBool(getFieldInsensitive(row, 'AceptaEncargo', 'aceptaEncargo'), false),

    function normalizeSheetProduct(row) {
      const rawId = getFieldInsensitive(row, 'ID', 'id');
      const rawNombre = getFieldInsensitive(row, 'Nombre', 'nombre', 'Producto', 'producto');
      if (!rawId && !rawNombre) return null;

      const nombre = String(rawNombre || 'Producto').trim();
      const id = String(rawId || ('prod-' + slugify(nombre))).trim();
      const tiendaId = String(getFieldInsensitive(row, 'TiendaID', 'tiendaId', 'tienda_id', 'Tienda') || '').trim();
      const rawFotos = parseListField(getFieldInsensitive(row, 'Fotos', 'fotos', 'Foto', 'foto'), []).map(fixDriveImageUrl);
      const fotos = rawFotos.length > 0 ? rawFotos : [makeSvgFallbackDataUri(nombre, '#1A2A44')];
      const precio = Number(getFieldInsensitive(row, 'Precio', 'precio')) || 0;
      const rawOffer = getFieldInsensitive(row, 'Precio oferta', 'PrecioOferta', 'precioOferta', 'Oferta');
      const precioOferta = rawOffer !== '' && rawOffer !== null && rawOffer !== undefined && Number(rawOffer) > 0
        ? Number(rawOffer)
        : null;
      const stockRaw = getFieldInsensitive(row, 'Stock', 'stock', 'stockDisponible');
      const cantRaw = getFieldInsensitive(row, 'Cantidad', 'cantidad', 'cantidadStock');
      const nuevoRaw = getFieldInsensitive(row, 'Nuevo', 'nuevo', 'esNuevo');
      const catRaw = getFieldInsensitive(row, 'Categoría', 'Categoria', 'categoria', 'Rubro');
      const descRaw = getFieldInsensitive(row, 'Descripción', 'Descripcion', 'descripcion');

      return {
        id,
        tiendaId,
        nombre,
        precio,
        precioOferta,
        esNuevo: parseBool(nuevoRaw, false),
        stockDisponible: parseBool(stockRaw, true),
        cantidadStock: cantRaw !== '' && cantRaw !== null && cantRaw !== undefined ? Number(cantRaw) : null,
        categoria: String(catRaw || 'Otros').trim(),
        descripcion: String(descRaw || '').trim(),
        fotos
      };
    }

    function mergeSheetDataIntoState(payload) {
      if (!payload || typeof payload !== 'object') return false;
      const data = payload.data && typeof payload.data === 'object' ? payload.data : payload;

      const sheetStoresRaw = getFieldInsensitive(data, 'Tiendas', 'tiendas');
      const sheetProdsRaw = getFieldInsensitive(data, 'Productos', 'productos');
      const sheetOffersRaw = getFieldInsensitive(data, 'Ofertas', 'ofertas');
      const sheetReviewsRaw = getFieldInsensitive(data, 'Reseñas', 'Resenas', 'resenas');
      const sheetOrdersRaw = getFieldInsensitive(data, 'Pedidos', 'pedidos');

      let changed = false;

      if (Array.isArray(sheetStoresRaw) && sheetStoresRaw.length > 0) {
        const normalizedStores = sheetStoresRaw.map(normalizeSheetStore).filter(Boolean);
        if (normalizedStores.length > 0) {
          const byId = new Map();
          db.tiendas.forEach(s => byId.set(s.id, s));
          normalizedStores.forEach(s => {
            const prev = byId.get(s.id);
            byId.set(s.id, {
              ...(prev || {}),
              ...s,
              password: s.password || (prev && prev.password) || '123456'
            });
          });
          db.tiendas = Array.from(byId.values());
          changed = true;
        }
      }

      if (Array.isArray(sheetProdsRaw) && sheetProdsRaw.length > 0) {
        const normalizedProds = sheetProdsRaw.map(normalizeSheetProduct).filter(Boolean);
        if (normalizedProds.length > 0) {
          const byProdId = new Map();
          db.productos.forEach(p => byProdId.set(p.id, p));
          normalizedProds.forEach(p => byProdId.set(p.id, p));
          db.productos = Array.from(byProdId.values());
          changed = true;
        }
      }

      if (Array.isArray(sheetOffersRaw) && sheetOffersRaw.length > 0) {
        db.ofertas = sheetOffersRaw.map((o, idx) => ({
          id: String(getFieldInsensitive(o, 'ID', 'id') || ('of-sheet-' + idx)),
          productoId: String(getFieldInsensitive(o, 'ProductoID', 'productoId', 'Producto') || ''),
          precioOferta: Number(getFieldInsensitive(o, 'Precio oferta', 'PrecioOferta', 'precioOferta')) || 0,
          hastaCuando: Number(getFieldInsensitive(o, 'Hasta cuándo', 'Hasta cuando', 'HastaCuando', 'hastaCuando')) || (Date.now() + 4 * 60 * 60 * 1000),
          destacada: parseBool(getFieldInsensitive(o, 'Destacada', 'destacada'), false)
        })).filter(o => o.productoId && o.precioOferta > 0);
        changed = true;
      }

      if (Array.isArray(sheetReviewsRaw) && sheetReviewsRaw.length > 0) {
        const byRevId = new Map();
        db.resenas.forEach(r => byRevId.set(r.id, r));
        sheetReviewsRaw.forEach((r, idx) => {
          const id = String(getFieldInsensitive(r, 'ID', 'id') || ('rev-sh-' + idx));
          const cliente = String(getFieldInsensitive(r, 'Cliente', 'cliente') || 'Vecino').trim();
          byRevId.set(id, {
            id,
            tiendaId: String(getFieldInsensitive(r, 'TiendaID', 'tiendaId') || ''),
            cliente,
            avatar: makeSvgFallbackDataUri(cliente, '#1A2A44'),
            fecha: String(getFieldInsensitive(r, 'Fecha', 'fecha') || 'Hoy'),
            estrellas: Number(getFieldInsensitive(r, 'Estrellas', 'estrellas')) || 5,
            comentario: String(getFieldInsensitive(r, 'Comentario', 'comentario') || ''),
            fotoProducto: fixDriveImageUrl(String(getFieldInsensitive(r, 'Foto', 'foto', 'fotoProducto') || ''))
          });
        });
        db.resenas = Array.from(byRevId.values());
        changed = true;
      }

      if (Array.isArray(sheetOrdersRaw) && sheetOrdersRaw.length > 0) {
        const byOrderId = new Map();
        db.pedidos.forEach(o => byOrderId.set(o.id, o));
        sheetOrdersRaw.forEach((ord, idx) => {
          const id = String(getFieldInsensitive(ord, 'ID', 'id') || ('PED-SH-' + (1000 + idx)));
          byOrderId.set(id, {
            id,
            tiendaId: String(getFieldInsensitive(ord, 'TiendaID', 'tiendaId') || ''),
            cliente: String(getFieldInsensitive(ord, 'Cliente', 'cliente') || 'Cliente'),
            barrio: String(getFieldInsensitive(ord, 'Barrio', 'barrio') || 'Centro'),
            direccion: String(getFieldInsensitive(ord, 'Dirección', 'Direccion', 'direccion') || ''),
            nota: String(getFieldInsensitive(ord, 'Nota', 'nota') || ''),
            fecha: String(getFieldInsensitive(ord, 'Fecha', 'fecha') || 'Hoy'),
            estado: String(getFieldInsensitive(ord, 'Estado', 'estado') || 'Nuevo'),
            esNuevoNoVisto: false,
            total: Number(getFieldInsensitive(ord, 'Total', 'total')) || 0,
            items: parseListField(getFieldInsensitive(ord, 'Productos', 'productos', 'items'), [])
          });
        });
        db.pedidos = Array.from(byOrderId.values());
        changed = true;
      }

      if (changed) {
        ensureDemoTemplateExists();
        saveState(db);
      }
      return changed;
    }

    async function fetchSheetDataOnLoad(notifyUser = false) {
      if (!SHEET_WEBAPP_URL) return false;
      try {
        const sep = SHEET_WEBAPP_URL.includes('?') ? '&' : '?';
        const res = await fetch(`${SHEET_WEBAPP_URL}${sep}action=getAll&incluirPedidos=1&t=${Date.now()}`, {
          method: 'GET',
          cache: 'no-store'
        });
        if (!res.ok) {
          if (notifyUser) showToast('No se pudo conectar con Google Sheets.', 'error');
          return false;
        }
        const json = await res.json();
        const updated = mergeSheetDataIntoState(json);
        if (updated) {
          render();
          if (notifyUser) showToast('Datos sincronizados desde Google Sheets.', 'success');
        } else if (notifyUser) {
          showToast('Conectado con Google Sheets.', 'info');
        }
        return updated;
      } catch (_) {
        if (notifyUser) showToast('No se pudo sincronizar ahora.', 'error');
        return false;
      }
    }

    async function pushToSheet(entity, record, action = 'upsert') {
      if (!SHEET_WEBAPP_URL) return false;
      try {
        await fetch(SHEET_WEBAPP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action,
            entity,
            timestamp: new Date().toISOString(),
            data: record
          })
        });
        return true;
      } catch (err) {
        console.warn('No se pudo enviar a Google Sheets:', err);
        return false;
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const initial = createInitialDatabase();
          saveState(initial);
          return initial;
        }
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.tiendas) || parsed.tiendas.length === 0 || !Array.isArray(parsed.productos)) {
          const initial = createInitialDatabase();
          saveState(initial);
          return initial;
        }
        return {
          tiendas: parsed.tiendas,
          productos: parsed.productos,
          ofertas: Array.isArray(parsed.ofertas) ? parsed.ofertas : [],
          resenas: Array.isArray(parsed.resenas) ? parsed.resenas : [],
          pedidos: Array.isArray(parsed.pedidos) ? parsed.pedidos : [],
          carrito: Array.isArray(parsed.carrito) ? parsed.carrito : [],
          favoritos: Array.isArray(parsed.favoritos) ? parsed.favoritos : [],
          misPedidosCliente: Array.isArray(parsed.misPedidosCliente) ? parsed.misPedidosCliente : []
        };
      } catch (err) {
        console.warn('Error leyendo estado local, inicializando demo:', err);
        const fallback = createInitialDatabase();
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(fallback)); } catch (_) {}
        return fallback;
      }
    }

    function formatARS(num) {

      return '$' + Math.round(n).toLocaleString('es-AR');

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const bgMap = {
        success: 'bg-[#2E7D32] text-white',
        error: 'bg-[#E53935] text-white',
        info: 'bg-[#1A2A44] text-white'
      };
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-sm font-semibold flex items-center justify-between gap-3 transition-all ${bgMap[type] || bgMap.info}`;
      toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 220);
      }, 3200);
    }

    function copyToClipboard(text, successMsg = '¡Copiado al portapapeles!') {
      try {
        const temp = document.createElement('textarea');
        temp.value = text;
        temp.setAttribute('readonly', '');
        temp.style.position = 'absolute';
        temp.style.left = '-9999px';
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        showToast(successMsg, 'success');
      } catch (_) {
        showToast('No se pudo copiar automáticamente.', 'error');
      }

    function normalizeWhatsAppPhone(raw) {
      const digits = String(raw || '').replace(/\D/g, '');
      if (!digits) return SUPPORT_WHATSAPP;
      if (digits.startsWith('549')) return digits;
      if (digits.startsWith('54')) return '549' + digits.slice(2);
      if (digits.length === 10) return '549' + digits;
      return digits;
    }

    function buildWhatsAppLink(phone, message) {
      const cleanPhone = normalizeWhatsAppPhone(phone);
      return `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;

    }

    function readImageFileAsDataUrl(file, maxWidth = 360, quality = 0.45) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) {
          reject(new Error('Seleccioná un archivo de imagen válido.'));
          return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              let w = img.width;
              let h = img.height;
              if (w > maxWidth) {
                h = Math.round((h * maxWidth) / w);
                w = maxWidth;
              }
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', quality));
            } catch (_) {
              resolve(ev.target.result);
            }
          };
          img.onerror = () => resolve(ev.target.result);
          img.src = ev.target.result;
        };
        reader.onerror = () => reject(new Error('No se pudo leer la foto de la galería.'));
        reader.readAsDataURL(file);
      });
    }

    function getOfferForProduct(productId) {
      const now = Date.now();
      return db.ofertas.find(o => o.productoId === productId && (!o.hastaCuando || o.hastaCuando > now)) || null;
    }

    function getEffectivePrice(product) {
      const offer = getOfferForProduct(product.id);
      if (offer && offer.precioOferta && offer.precioOferta < product.precio) {
        return {
          finalPrice: Number(offer.precioOferta),
          originalPrice: Number(product.precio),
          hasOffer: true,
          discountPct: Math.max(1, Math.round(((product.precio - offer.precioOferta) / product.precio) * 100)),
          hastaCuando: offer.hastaCuando
        };
      }
      if (product.precioOferta && product.precioOferta < product.precio) {
        return {
          finalPrice: Number(product.precioOferta),
          originalPrice: Number(product.precio),
          hasOffer: true,
          discountPct: Math.max(1, Math.round(((product.precio - product.precioOferta) / product.precio) * 100)),
          hastaCuando: Date.now() + 4 * 60 * 60 * 1000
        };
      }
      return {
        finalPrice: Number(product.precio),
        originalPrice: Number(product.precio),
        hasOffer: false,
        discountPct: 0,
        hastaCuando: null
      };
    }

    function getRemainingCountdownText(hastaCuando) {
      if (!hastaCuando) return 'Termina hoy 20:00';
      const diffMs = Math.max(0, hastaCuando - Date.now());
      const hours = Math.floor(diffMs / (1000 * 60 * 60));
      const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
      if (hours <= 0 && mins <= 0) return 'Termina hoy 20:00';
      return `Quedan ${Math.max(1, hours)} hs ${mins > 0 ? `${mins}m` : ''}`;
    }

    function isRecommendedStore(store) {
      const storeReviews = db.resenas.filter(r => r.tiendaId === store.id && r.estrellas === 5).length;
      return (store.fiveStarCount || 0) >= 20 || storeReviews >= 20;
    }

    function matchesCategoryFilter(itemCat, filterCat) {
      if (!filterCat || filterCat === 'Todas') return true;
      const a = normalizeKey(itemCat);
      const b = normalizeKey(filterCat);
      if (a === b) return true;
      if (b === 'ropa') return a.includes('ropa') || a.includes('calzado');
      if (b === 'hogar') return a.includes('hogar') || a.includes('deco');
      if (b === 'regalos') return a.includes('regalo') || a.includes('artesan');
      return a.includes(b) || b.includes(a);
    }

    function navigate(route, params = {}) {
      ui.route = route;
      if (params.storeSlug) ui.storeSlug = params.storeSlug;
      if (typeof params.search === 'string') ui.searchQuery = params.search;
      if (typeof params.category === 'string') {
        ui.selectedCategory = params.category;
        ui.offersCategory = params.category;
      }
      if (typeof params.paraHoy === 'boolean') ui.paraHoy = params.paraHoy;
      if (params.vendorTab) ui.vendorTab = params.vendorTab;
      ui.cartOpen = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function addToCart(productId, qty = 1) {
      const prod = db.productos.find(p => p.id === productId);
      if (!prod) return;
      if (!prod.stockDisponible) {
        showToast('Este producto está AGOTADO por el momento.', 'error');
        return;
      }
      const store = getStoreById(prod.tiendaId);
      if (!store) return;

      const pricing = getEffectivePrice(prod);
      const existing = db.carrito.find(item => item.productoId === prod.id);
      if (existing) {
        existing.cantidad += qty;
        existing.precio = pricing.finalPrice;
      } else {
        db.carrito.push({
          productoId: prod.id,
          tiendaId: store.id,
          tiendaNombre: store.nombre,
          nombre: prod.nombre,
          precio: pricing.finalPrice,
          cantidad: qty,
          foto: (prod.fotos && prod.fotos[0]) || store.logo || SAMPLE_FALLBACK_PHOTO
        });
      }
      saveState(db);
      showToast(`Agregaste "${prod.nombre}" al carrito.`, 'success');
      render();
    }

    function updateCartQty(productoId, delta) {
      const idx = db.carrito.findIndex(item => item.productoId === productoId);
      if (idx === -1) return;
      db.carrito[idx].cantidad += delta;
      if (db.carrito[idx].cantidad <= 0) {
        db.carrito.splice(idx, 1);
      }
      saveState(db);
      render();
    }

    function removeCartItem(productoId) {
      db.carrito = db.carrito.filter(item => item.productoId !== productoId);
      saveState(db);
      render();
    }

    function clearCart() {
      db.carrito = [];
      saveState(db);
      showToast('Carrito vaciado.', 'info');
      render();
    }

    function quickBuyWhatsApp(productId) {
      const prod = db.productos.find(p => p.id === productId);
      if (!prod) return;
      const store = getStoreById(prod.tiendaId);
      if (!store) return;
      const pricing = getEffectivePrice(prod);
      const msg = `Hola ${store.nombre}, quiero pedir ${prod.nombre} de ${formatARS(pricing.finalPrice)} que vi en Mercado Tres Arroyos. ¿Tenés disponible?`;

      const quickOrder = {
        id: 'PED-' + Math.floor(1000 + Math.random() * 9000),
        tiendaId: store.id,
        tiendaNombre: store.nombre,
        cliente: 'Vecino de Tres Arroyos',
        barrio: store.barrio,
        direccion: 'A coordinar por WhatsApp',
        nota: 'Pedido directo desde catálogo',
        fecha: 'Hoy ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }),
        estado: 'Nuevo',
        esNuevoNoVisto: true,
        total: pricing.finalPrice,
        items: [
          {
            productoId: prod.id,
            nombre: prod.nombre,
            cantidad: 1,
            precioUnitario: pricing.finalPrice,
            foto: (prod.fotos && prod.fotos[0]) || SAMPLE_FALLBACK_PHOTO
          }
        ]
      };

      db.pedidos.unshift(quickOrder);
      saveState(db);
      syncOrderToSheet(quickOrder);
      openWhatsAppUrl(store.whatsapp, msg);
    }

    function toggleFavoriteStore(storeId) {
      if (db.favoritos.includes(storeId)) {
        db.favoritos = db.favoritos.filter(id => id !== storeId);
        showToast('Quitada de tus favoritos.', 'info');
      } else {
        db.favoritos.push(storeId);
        showToast('¡Guardada en favoritos!', 'success');
      }
      saveState(db);
      render();
    }

    function renderSafeImage(src, alt, className = '', fallbackDataUri = SAMPLE_FALLBACK_PHOTO) {
      const fixed = fixDriveImageUrl(src);
      const cleanSrc = (fixed && String(fixed).trim()) ? String(fixed).trim() : fallbackDataUri;
      const safeFb = fallbackDataUri || SAMPLE_FALLBACK_PHOTO;
      return `
        <img
          src="${escapeHtml(cleanSrc)}"
          alt="${escapeHtml(alt || 'Mercado Tres Arroyos')}"
          loading="lazy"
          referrerpolicy="no-referrer"
          class="w-full h-full object-cover ${className}"
          onerror="if(this.dataset.fbDone!=='1'){this.dataset.fbDone='1';this.src='${escapeHtml(safeFb)}';}"
        />
      `;
    }

    function renderStars(rating = 4.8) {
      const val = Number(rating) || 4.8;
      return `<span class="text-[#FFC107] font-bold">★</span> <span class="font-bold text-[#111111]">${val.toFixed(1)}</span>`;
    }

      const visibleStores = getVisibleStores();
      const visibleStoreIds = new Set(visibleStores.map(s => s.id));
      const q = (ui.searchQuery || '').trim().toLowerCase();

      const filteredProductsBase = db.productos.filter(p => {
        if (!visibleStoreIds.has(p.tiendaId)) return false;
        if (ui.paraHoy) {
          const st = getStoreById(p.tiendaId);
          if (!st || !st.abiertoAhora || !st.haceEnvios) return false;
        }
        if (!q) return true;
        const st = getStoreById(p.tiendaId);
        const nameMatch = (p.nombre || '').toLowerCase().includes(q);
        const catMatch = (p.categoria || '').toLowerCase().includes(q);
        const storeMatch = st ? (st.nombre || '').toLowerCase().includes(q) : false;
        return nameMatch || catMatch || storeMatch;
      });

      const filteredStores = visibleStores.filter(st => {
        if (ui.paraHoy && (!st.abiertoAhora || !st.haceEnvios)) return false;
        if (!q) return true;
        const hasMatchingProd = db.productos.some(p => p.tiendaId === st.id && (p.nombre || '').toLowerCase().includes(q));
        return (st.nombre || '').toLowerCase().includes(q) ||
          (st.rubro || '').toLowerCase().includes(q) ||
          (st.barrio || '').toLowerCase().includes(q) ||
          hasMatchingProd;
      });

      const offerProducts = filteredProductsBase.filter(p => getEffectivePrice(p).hasOffer).slice(0, 6);
      const featuredStores = filteredStores.filter(st => !isTemplateStore(st)).slice(0, 6);
      const newProducts = filteredProductsBase.filter(p => p.esNuevo).slice(0, 4);

            </h1>
            <p class="mt-2.5 text-base sm:text-lg text-[#666666] max-w-2xl mx-auto">

                />
                <button
                  type="button"
                  onclick="navigate('TIENDAS', { search: document.getElementById('home-main-search').value })"
                  class="absolute right-2.5 min-h-[42px] px-3.5 rounded-xl bg-[#1A2A44] hover:bg-[#111111] text-white text-xs sm:text-sm font-bold"
                >
                  Buscar

              </div>

              <div class="mt-3.5 flex items-center justify-start sm:justify-center gap-2 overflow-x-auto no-scrollbar py-1">

    // 2. SECCIÓN TIENDAS
    function renderStoresDirectory() {
      const catChips = ['Todas', 'Comida', 'Dulces', 'Ropa', 'Belleza', 'Hogar', 'Regalos', 'Mascotas'];
      const q = (ui.searchQuery || '').trim().toLowerCase();

      let list = getVisibleStores().filter(st => {
        if (!matchesCategoryFilter(st.rubro, ui.selectedCategory)) return false;
        if (ui.selectedBarrio !== 'Todos' && st.barrio !== ui.selectedBarrio) return false;
        if (ui.soloAbierto && !st.abiertoAhora) return false;
        if (ui.soloEnvios && !st.haceEnvios) return false;
        if (ui.soloOfertas) {
          const hasOff = db.productos.some(p => p.tiendaId === st.id && getEffectivePrice(p).hasOffer);
          if (!hasOff) return false;
        }
        if (q) {
          const prodMatch = db.productos.some(p => p.tiendaId === st.id && (p.nombre || '').toLowerCase().includes(q));
          const stMatch = (st.nombre || '').toLowerCase().includes(q) ||
            (st.rubro || '').toLowerCase().includes(q) ||
            (st.barrio || '').toLowerCase().includes(q);
          if (!stMatch && !prodMatch) return false;
        }
        return true;
      });

      if (ui.sortBy === 'mas_vendidas') {
        list.sort((a, b) => (b.salesCount || 0) - (a.salesCount || 0));
      } else if (ui.sortBy === 'mas_nuevas') {
        list.sort((a, b) => String(b.fechaRegistro || '').localeCompare(String(a.fechaRegistro || '')));
      } else if (ui.sortBy === 'mejor_puntuadas') {
        list.sort((a, b) => (b.rating || 0) - (a.rating || 0));
      } else if (ui.sortBy === 'cerca_mio') {
        const orderB = ['Centro', 'La Cañada', 'Cooperativa', 'Villa Italia', 'Ranchos', 'Otros'];
        list.sort((a, b) => orderB.indexOf(a.barrio) - orderB.indexOf(b.barrio));
      }

      return `

          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-3">
            ${catChips.map(ch => {
              const active = matchesCategoryFilter(ch, ui.selectedCategory) && (ch === 'Todas' ? ui.selectedCategory === 'Todas' : true);
              return `
                <button

          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 mb-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 items-center">

                <option value="Todos" ${ui.selectedBarrio === 'Todos' ? 'selected' : ''}>Todos</option>
                ${['Centro', 'La Cañada', 'Cooperativa', 'Ranchos', 'Villa Italia'].map(b => `<option value="${b}" ${ui.selectedBarrio === b ? 'selected' : ''}>${b}</option>`).join('')}
              </select>
            </div>

            <div>
              <label class="block text-[11px] font-bold text-[#666666] mb-1">Ordenar por</label>
              <select onchange="ui.sortBy = this.value; render();" class="w-full min-h-[48px] px-3 rounded-xl border border-slate-300 bg-white text-sm font-semibold">
                <option value="mas_vendidas" ${ui.sortBy === 'mas_vendidas' ? 'selected' : ''}>Más vendidas</option>
                <option value="mas_nuevas" ${ui.sortBy === 'mas_nuevas' ? 'selected' : ''}>Más nuevas</option>
                <option value="mejor_puntuadas" ${ui.sortBy === 'mejor_puntuadas' ? 'selected' : ''}>Mejor puntuadas</option>
                <option value="cerca_mio" ${ui.sortBy === 'cerca_mio' ? 'selected' : ''}>Cerca mío</option>

            </div>

            <button type="button" onclick="ui.soloAbierto = !ui.soloAbierto; render();" class="min-h-[48px] px-3 py-2 rounded-[12px] border text-xs font-extrabold flex items-center justify-center gap-1.5 ${ui.soloAbierto ? 'bg-[#2E7D32] text-white border-[#2E7D32]' : 'bg-white text-[#111111] border-slate-300'}">
              <span>${ui.soloAbierto ? '✓' : '○'}</span>
              <span>Abierto ahora</span>
            </button>

            <button type="button" onclick="ui.soloEnvios = !ui.soloEnvios; render();" class="min-h-[48px] px-3 py-2 rounded-[12px] border text-xs font-extrabold flex items-center justify-center gap-1.5 ${ui.soloEnvios ? 'bg-[#1A2A44] text-white border-[#1A2A44]' : 'bg-white text-[#111111] border-slate-300'}">
              <span>${ui.soloEnvios ? '✓' : '○'}</span>
              <span>Hace envíos</span>
            </button>

            <button type="button" onclick="ui.soloOfertas = !ui.soloOfertas; render();" class="min-h-[48px] px-3 py-2 rounded-[12px] border text-xs font-extrabold flex items-center justify-center gap-1.5 ${ui.soloOfertas ? 'bg-[#E53935] text-white border-[#E53935]' : 'bg-white text-[#111111] border-slate-300'}">
              <span>${ui.soloOfertas ? '✓' : '○'}</span>
              <span>Con ofertas hoy</span>
            </button>
          </div>

          ${list.length > 0 ? `
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
              ${list.map(st => renderStoreCard(st)).join('')}
            </div>
          ` : `
            <div class="bg-slate-50 border border-slate-200 rounded-3xl p-10 text-center">
              <p class="text-base sm:text-lg font-bold text-[#111111]">
                No encontramos tiendas con ese filtro. Probá con otro barrio o categoría.
              </p>
              <button type="button" onclick="ui.searchQuery=''; ui.selectedCategory='Todas'; ui.selectedBarrio='Todos'; ui.soloAbierto=false; ui.soloEnvios=false; ui.soloOfertas=false; render();" class="mt-5 min-h-[48px] px-6 py-3 rounded-[12px] bg-[#1A2A44] text-white font-bold text-sm">
                Ver todas
              </button>
            </div>
          `}
        </main>
      `;
    }

    // 5. CARRITO POR WHATSAPP
    function renderCartDrawer() {
      if (!ui.cartOpen) return '';

      const byStore = new Map();
      db.carrito.forEach(item => {
        if (!byStore.has(item.tiendaId)) {
          byStore.set(item.tiendaId, []);
        }
        byStore.get(item.tiendaId).push(item);
      });

      const subtotalGeneral = db.carrito.reduce((sum, it) => sum + it.precio * it.cantidad, 0);
      let totalShipping = 0;
      byStore.forEach((items, storeId) => {
        const st = getStoreById(storeId);
        const storeSub = items.reduce((s, i) => s + i.precio * i.cantidad, 0);
        if (st && st.haceEnvios) {
          totalShipping += (st.envioGratisDesde && storeSub >= st.envioGratisDesde) ? 0 : (Number(st.precioEnvio) || 0);
        }
      });
      const finalTotal = subtotalGeneral + totalShipping;

      return `
        <div class="fixed inset-0 z-[80] flex justify-end bg-black/55 backdrop-blur-[1px]">
          <div class="w-full max-w-lg bg-white h-full flex flex-col justify-between shadow-2xl overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between bg-white">

                <h2 class="font-extrabold text-xl text-[#1A2A44]">Tu pedido</h2>
                <p class="text-xs text-[#666666]">Sin pago online · Coordinás directo por WhatsApp</p>

                  </button>
                </div>

                ${Array.from(byStore.entries()).map(([storeId, items]) => {
                  const st = getStoreById(storeId) || { nombre: 'Tienda', barrio: 'Centro', whatsapp: SUPPORT_WHATSAPP, haceEnvios: true, precioEnvio: 1500 };
                  const storeSub = items.reduce((s, i) => s + i.precio * i.cantidad, 0);
                  const storeShip = st.haceEnvios ? ((st.envioGratisDesde && storeSub >= st.envioGratisDesde) ? 0 : (Number(st.precioEnvio) || 0)) : 0;

                  return `
                    <div class="border border-slate-200 rounded-2xl p-4 bg-slate-50/50">

                        <span class="font-extrabold text-sm text-[#1A2A44]">🏪 ${escapeHtml(st.nombre)}</span>
                        <span class="text-xs font-semibold text-[#666666]">📍 ${escapeHtml(st.barrio)}</span>
                      </div>

                      <div class="space-y-2.5">
                        ${items.map(it => `
                          <div class="flex items-center gap-3 bg-white p-2.5 rounded-xl border border-slate-100">
                            <div class="w-12 h-12 rounded-lg overflow-hidden bg-slate-100 shrink-0">
                              ${renderSafeImage(it.foto, it.nombre)}
                            </div>
                            <div class="flex-1 min-w-0">
                              <div class="text-xs font-bold text-[#111111] truncate">${escapeHtml(it.nombre)}</div>
                              <div class="text-xs text-[#666666]">${formatARS(it.precio)} c/u</div>
                              <div class="mt-1.5 flex items-center gap-2">
                                <button type="button" onclick="updateCartQty('${it.productoId}', -1)" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 font-extrabold text-sm flex items-center justify-center">-</button>
                                <span class="text-xs font-extrabold min-w-[18px] text-center">${it.cantidad}</span>
                                <button type="button" onclick="updateCartQty('${it.productoId}', 1)" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 font-extrabold text-sm flex items-center justify-center">+</button>
                                <span class="ml-auto text-xs font-extrabold text-[#111111]">${formatARS(it.precio * it.cantidad)}</span>
                              </div>
                            </div>

                      <div class="mt-3 pt-2.5 border-t border-slate-200/80 flex items-center justify-between text-xs font-bold text-[#111111]">

                <form id="cart-checkout-form" class="space-y-3 bg-slate-50 border border-slate-200 rounded-2xl p-4">

                      <label class="block text-xs font-bold text-[#111111] mb-1">Barrio</label>

                      <label class="block text-xs font-bold text-[#111111] mb-1">Dirección *</label>
                      <input id="cart-customer-address" type="text" required placeholder="Calle y número" class="w-full min-h-[46px] px-3.5 rounded-xl border border-slate-300 bg-white text-sm outline-none focus:border-[#1A2A44]" />
                    </div>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-[#111111] mb-1">Nota (opcional)</label>
                    <input id="cart-customer-note" type="text" placeholder="Ej: Sin cebolla, timbre 2" class="w-full min-h-[46px] px-3.5 rounded-xl border border-slate-300 bg-white text-sm outline-none focus:border-[#1A2A44]" />
                  </div>

                  <div class="pt-2 border-t border-slate-200 space-y-1 text-xs">
                    <div class="flex justify-between text-[#666666]"><span>Subtotal</span><span>${formatARS(subtotalGeneral)}</span></div>
                    <div class="flex justify-between text-[#666666]"><span>Envío</span><span>${formatARS(totalShipping)}</span></div>
                    <div class="flex justify-between text-base font-extrabold text-[#111111] pt-1"><span>Total</span><span>${formatARS(finalTotal)}</span></div>
                  </div>

                  <button type="submit" class="min-h-[52px] w-full px-5 py-3 rounded-[12px] bg-[#25D366] hover:bg-[#1EB956] text-white font-extrabold text-sm sm:text-base flex items-center justify-center gap-2">

                        </div>
                        <button type="button" onclick="repeatCustomerOrder('${mp.id}')" class="nav-item-nowrap min-h-[38px] px-3 py-1.5 rounded-lg bg-[#1A2A44] text-white font-bold text-xs shrink-0">
                          Repetir pedido
                        </button>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </div>

            <div class="px-5 py-3.5 border-t border-slate-200 bg-slate-50 flex items-center justify-between gap-2">
              <button type="button" onclick="clearCart()" class="min-h-[44px] px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-bold text-[#666666] hover:text-[#E53935]">
                Vaciar carrito
              </button>
              <button type="button" onclick="ui.cartOpen = false; render();" class="min-h-[44px] px-4 py-2 rounded-xl bg-white border border-slate-300 text-xs font-bold text-[#111111]">
                Seguir comprando
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function repeatCustomerOrder(orderId) {
      const ord = db.misPedidosCliente.find(o => o.id === orderId);
      if (!ord || !Array.isArray(ord.items)) return;
      ord.items.forEach(it => {
        if (it.productoId) addToCart(it.productoId, it.cantidad || 1);
      });
      showToast('¡Pedido repetido en tu carrito!', 'success');
    }

    async function handleRegImageUpload(event, field) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        const dataUrl = await readImageFileAsDataUrl(file);
        ui.regDraft[field] = dataUrl;
        showToast('Foto cargada desde tu galería.', 'success');
        render();
      } catch (err) {
        showToast(err.message || 'No se pudo cargar la foto.', 'error');
      }
    }

    function renderVendorTabMyProducts(store, myProducts) {
      const q = (ui.vendorProductSearch || '').trim().toLowerCase();
      const filtered = myProducts.filter(p => !q || (p.nombre || '').toLowerCase().includes(q));

      return `
        <div class="space-y-5">
          <div class="bg-white border border-slate-200 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex-1 flex items-center gap-2">
              <div class="relative flex-1">
                <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-sm text-[#666666]">🔍</span>
                <input
                  id="vendor-prod-search-input"
                  type="search"
                  value="${escapeHtml(ui.vendorProductSearch)}"
                  oninput="ui.vendorProductSearch = this.value;"
                  onkeydown="if(event.key === 'Enter') { event.preventDefault(); render(); }"
                  placeholder="Buscar mi producto..."
                  class="w-full min-h-[48px] pl-10 pr-4 rounded-xl border border-slate-300 text-sm outline-none focus:border-[#1A2A44]"
                />
              </div>
              <button type="button" onclick="render();" class="min-h-[48px] px-4 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-extrabold text-[#1A2A44] shrink-0">
                Filtrar
              </button>
            </div>

            <div class="flex items-center gap-3 justify-between sm:justify-end">
              <span class="text-xs font-extrabold text-[#666666] whitespace-nowrap">
                ${myProducts.length} productos
              </span>
              <button type="button" onclick="window.__vendorOpenNewProductForm('${store.id}')" class="nav-item-nowrap min-h-[48px] px-5 py-2.5 rounded-[12px] bg-[#25D366] hover:bg-[#1EB956] text-white font-extrabold text-sm">
                + Agregar producto
              </button>
            </div>
          </div>

          ${ui.showProductForm && ui.productFormDraft ? renderVendorProductForm(store, ui.productFormDraft) : ''}

          ${filtered.length > 0 ? `
            <div class="space-y-3">
              ${filtered.map((p, idx) => {
                const pricing = getEffectivePrice(p);
                const thumb = (p.fotos && p.fotos[0]) || SAMPLE_FALLBACK_PHOTO;
                return `
                  <div class="bg-white border border-slate-200 rounded-2xl p-3.5 sm:p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-16 h-16 rounded-xl overflow-hidden bg-slate-100 shrink-0">
                        ${renderSafeImage(thumb, p.nombre)}
                      </div>
                      <div class="min-w-0">
                        <div class="flex items-center gap-2 flex-wrap">
                          <span class="font-extrabold text-sm sm:text-base text-[#111111] truncate">${escapeHtml(p.nombre)}</span>
                          ${pricing.hasOffer ? `<span class="px-2 py-0.5 rounded-md bg-[#E53935] text-white text-[10px] font-extrabold">-${pricing.discountPct}%</span>` : ''}
                          ${p.esNuevo ? `<span class="px-2 py-0.5 rounded-md bg-[#7C4DFF] text-white text-[10px] font-extrabold">NUEVO</span>` : ''}
                          <span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold ${p.stockDisponible ? 'bg-emerald-50 text-[#2E7D32]' : 'bg-slate-200 text-[#666666]'}">
                            ${p.stockDisponible ? 'Disponible' : 'Agotado'}
                          </span>
                        </div>
                        <div class="text-sm font-extrabold text-[#1A2A44] mt-0.5">
                          ${formatARS(pricing.finalPrice)}
                          ${pricing.hasOffer ? `<span class="text-xs text-[#666666] line-through ml-1">${formatARS(pricing.originalPrice)}</span>` : ''}
                        </div>
                      </div>
                    </div>

                    <div class="flex items-center gap-1.5 flex-wrap">
                      ${idx > 0 ? `<button type="button" onclick="window.__vendorMoveProduct('${p.id}', -1)" class="min-h-[38px] px-2.5 py-1.5 rounded-xl bg-slate-100 text-xs font-bold">↑</button>` : ''}
                      ${idx < filtered.length - 1 ? `<button type="button" onclick="window.__vendorMoveProduct('${p.id}', 1)" class="min-h-[38px] px-2.5 py-1.5 rounded-xl bg-slate-100 text-xs font-bold">↓</button>` : ''}
                      <button type="button" onclick="window.__vendorEditProduct('${p.id}')" class="min-h-[38px] px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-[#111111]">Editar</button>
                      <button type="button" onclick="window.__vendorToggleProductOffer('${p.id}')" class="min-h-[38px] px-3 py-1.5 rounded-xl bg-amber-50 hover:bg-amber-100 text-xs font-bold text-amber-900">
                        ${pricing.hasOffer ? 'Quitar oferta' : 'Oferta'}
                      </button>
                      <button type="button" onclick="window.__vendorDuplicateProduct('${p.id}')" class="min-h-[38px] px-3 py-1.5 rounded-xl bg-blue-50 hover:bg-blue-100 text-xs font-bold text-blue-800">Duplicar</button>
                      <button type="button" onclick="window.__vendorAskDeleteProduct('${p.id}')" class="min-h-[38px] px-3 py-1.5 rounded-xl bg-red-50 hover:bg-red-100 text-xs font-bold text-[#E53935]">Borrar</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : `
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-8 text-center">
              <p class="font-bold text-base text-[#111111]">Todavía no hay productos cargados.</p>
              <button type="button" onclick="window.__vendorOpenNewProductForm('${store.id}')" class="mt-4 min-h-[48px] px-5 py-2.5 rounded-[12px] bg-[#25D366] text-white font-bold text-sm">
                + Agregar producto
              </button>
            </div>
          `}
        </div>
      `;
    }

    function renderVendorProductForm(store, draft) {
      const photos = Array.isArray(draft.fotos) ? draft.fotos : [];
      const disc = (draft.precioOferta && draft.precio > 0 && Number(draft.precioOferta) < Number(draft.precio))
        ? Math.max(1, Math.round(((draft.precio - draft.precioOferta) / draft.precio) * 100))
        : 0;

      return `
        <form id="vendor-product-form" class="bg-slate-50 border-2 border-[#1A2A44]/20 rounded-3xl p-5 sm:p-6 space-y-5">
          <div class="flex items-center justify-between">
            <h3 class="font-extrabold text-lg text-[#1A2A44]">${draft.id ? 'Editar producto' : 'Nuevo producto'}</h3>
            <button type="button" onclick="ui.showProductForm = false; ui.productFormDraft = null; render();" class="text-xs font-bold text-[#666666]">Cancelar</button>
          </div>

          <div>
            <div class="flex items-center justify-between gap-2 mb-2 flex-wrap">
              <span class="text-xs font-extrabold text-[#111111]">Fotos desde galería (hasta 3 · reordená con ← / →)</span>
              <label class="min-h-[44px] px-4 py-2 rounded-xl bg-[#1A2A44] text-white text-xs font-extrabold inline-flex items-center gap-1.5 cursor-pointer">
                <span>📷 Agregar fotos</span>
                <input type="file" accept="image/*" multiple class="hidden" onchange="window.__vendorUploadProductPhotos(event)" />
              </label>
            </div>

            <div class="grid grid-cols-3 gap-3">
              ${photos.slice(0, 3).map((ph, i) => `
                <div class="relative aspect-square rounded-2xl overflow-hidden bg-white border border-slate-200">
                  ${renderSafeImage(ph, draft.nombre || 'Foto')}
                  <span class="absolute bottom-1.5 left-1.5 px-2 py-0.5 rounded-md text-[10px] font-extrabold ${i === 0 ? 'bg-[#1A2A44] text-white' : 'bg-black/65 text-white'}">
                    ${i === 0 ? 'Principal' : `Foto ${i + 1}`}
                  </span>
                  <div class="absolute top-1.5 left-1.5 flex gap-1">
                    ${i > 0 ? `<button type="button" onclick="window.__vendorMoveProductPhoto(${i}, -1)" class="w-6 h-6 rounded-full bg-white/90 text-[#111111] font-extrabold text-xs">←</button>` : ''}
                    ${i < photos.length - 1 ? `<button type="button" onclick="window.__vendorMoveProductPhoto(${i}, 1)" class="w-6 h-6 rounded-full bg-white/90 text-[#111111] font-extrabold text-xs">→</button>` : ''}
                  </div>
                  <button type="button" onclick="window.__vendorRemoveProductPhoto(${i})" class="absolute top-1.5 right-1.5 w-7 h-7 rounded-full bg-[#E53935] text-white font-extrabold text-xs flex items-center justify-center">
                    ✕
                  </button>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-[#111111] mb-1">Nombre *</label>
              <input id="prod-name-input" type="text" required maxlength="50" value="${escapeHtml(draft.nombre)}" oninput="ui.productFormDraft.nombre = this.value;" placeholder="Ej: Torta de chocolate" class="w-full min-h-[48px] px-3.5 rounded-xl border border-slate-300 bg-white text-sm font-semibold" />
            </div>
            <div>
              <label class="block text-xs font-bold text-[#111111] mb-1">Categoría</label>
              <select onchange="ui.productFormDraft.categoria = this.value;" class="w-full min-h-[48px] px-3.5 rounded-xl border border-slate-300 bg-white text-sm font-semibold">
                ${ALL_RUBROS.map(r => `<option value="${r}" ${draft.categoria === r ? 'selected' : ''}>${r}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-bold text-[#111111] mb-1">Precio ($) *</label>
              <input
                id="prod-price-input"
                type="number"
                required
                min="1"
                value="${Number(draft.precio) || 0}"
                oninput="
                  ui.productFormDraft.precio = Number(this.value) || 0;
                  updateLiveText('prod-price-formatted', formatARS(ui.productFormDraft.precio));
                  updateOfferDiscountPreview('prod-price-input', 'prod-offer-input', 'prod-offer-badge');
                "
                class="w-full min-h-[48px] px-3.5 rounded-xl border border-slate-300 bg-white text-sm font-extrabold"
              />
              <span id="prod-price-formatted" class="text-[11px] text-[#666666]">${formatARS(draft.precio)}</span>
            </div>

            <div>
              <label class="block text-xs font-bold text-[#111111] mb-1">Precio oferta (opcional)</label>
              <input
                id="prod-offer-input"
                type="number"
                min="0"
                value="${draft.precioOferta ? Number(draft.precioOferta) : ''}"
                oninput="
                  ui.productFormDraft.precioOferta = this.value ? Number(this.value) : null;
                  updateOfferDiscountPreview('prod-price-input', 'prod-offer-input', 'prod-offer-badge');
                "
                placeholder="Ej: 14500"
                class="w-full min-h-[48px] px-3.5 rounded-xl border border-slate-300 bg-white text-sm font-extrabold"
              />
              <span id="prod-offer-badge" class="text-[11px] font-extrabold text-[#E53935]">${disc > 0 ? `Descuento automático: -${disc}%` : ''}</span>
            </div>

            <div>
              <label class="block text-xs font-bold text-[#111111] mb-1">Cantidad opcional</label>
              <input
                type="number"
                min="0"
                value="${draft.cantidadStock !== undefined && draft.cantidadStock !== null ? Number(draft.cantidadStock) : ''}"
                oninput="ui.productFormDraft.cantidadStock = this.value === '' ? null : Number(this.value);"
                placeholder="Ej: 3"
                class="w-full min-h-[48px] px-3.5 rounded-xl border border-slate-300 bg-white text-sm"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-[#111111] mb-1">Descripción</label>
            <textarea rows="2" maxlength="200" oninput="ui.productFormDraft.descripcion = this.value;" class="w-full p-3 rounded-xl border border-slate-300 bg-white text-sm">${escapeHtml(draft.descripcion || '')}</textarea>
          </div>

          <div class="flex items-center gap-4 flex-wrap">
            <label class="flex items-center gap-2 text-xs font-extrabold text-[#111111] cursor-pointer">
              <input type="checkbox" ${draft.stockDisponible ? 'checked' : ''} onchange="ui.productFormDraft.stockDisponible = this.checked;" class="w-4 h-4" />
              <span>Disponible</span>
            </label>
            <label class="flex items-center gap-2 text-xs font-extrabold text-[#7C4DFF] cursor-pointer">
              <input type="checkbox" ${draft.esNuevo ? 'checked' : ''} onchange="ui.productFormDraft.esNuevo = this.checked;" class="w-4 h-4" />
              <span>Etiqueta NUEVO</span>
            </label>
          </div>

          <div class="flex items-center gap-3 pt-1">
            <button type="submit" class="min-h-[48px] px-6 py-2.5 rounded-[12px] bg-[#25D366] hover:bg-[#1EB956] text-white font-extrabold text-sm">
              Guardar producto
            </button>
            <button type="button" onclick="ui.showProductForm = false; ui.productFormDraft = null; render();" class="min-h-[48px] px-5 py-2.5 rounded-[12px] bg-slate-200 text-[#111111] font-bold text-sm">
              Cancelar
            </button>
          </div>
        </form>
      `;
    }

    function renderVendorTabMyOrders(store, myOrders, newOrdersCount) {
      const filtered = myOrders.filter(o => {
        if (ui.vendorOrderStatusFilter !== 'Todos' && o.estado !== ui.vendorOrderStatusFilter) return false;
        if (ui.vendorOrderDateFilter === 'Hoy' && !String(o.fecha || '').toLowerCase().includes('hoy')) return false;
        return true;
      });

      const statusBadge = (st) => {
        if (st === 'Nuevo') return 'bg-amber-100 text-amber-800';
        if (st === 'Confirmado') return 'bg-blue-100 text-blue-800';
        if (st === 'Entregado') return 'bg-emerald-100 text-[#2E7D32]';
        return 'bg-red-100 text-[#E53935]';
      };

      return `
        <div class="space-y-5">
          <div class="bg-white border border-slate-200 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-xs font-extrabold text-[#1A2A44]">Pedidos (${filtered.length})</span>
              ${newOrdersCount > 0 ? `<span class="px-2.5 py-0.5 rounded-full bg-[#E53935] text-white text-xs font-extrabold">${newOrdersCount} nuevos</span>` : ''}
            </div>
            <div class="flex items-center gap-2 flex-wrap">
              <select onchange="ui.vendorOrderDateFilter = this.value; render();" class="min-h-[42px] px-3 rounded-xl border border-slate-300 bg-white text-xs font-bold">
                <option value="Todos" ${ui.vendorOrderDateFilter === 'Todos' ? 'selected' : ''}>Todos</option>
                <option value="Hoy" ${ui.vendorOrderDateFilter === 'Hoy' ? 'selected' : ''}>Hoy</option>
              </select>
              <select onchange="ui.vendorOrderStatusFilter = this.value; render();" class="min-h-[42px] px-3 rounded-xl border border-slate-300 bg-white text-xs font-bold">
                ${['Todos', 'Nuevo', 'Confirmado', 'Entregado', 'Cancelado'].map(s => `<option value="${s}" ${ui.vendorOrderStatusFilter === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </div>
          </div>

          ${filtered.length > 0 ? `
            <div class="space-y-4">
              ${filtered.map(ord => {
                const itemsList = Array.isArray(ord.items) ? ord.items : [];
                return `
                  <article class="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5">
                    <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">
                      <div>
                        <div class="flex items-center gap-2">
                          <span class="font-extrabold text-sm text-[#1A2A44]">#${escapeHtml(ord.id)}</span>
                          <span class="px-2.5 py-0.5 rounded-full text-xs font-extrabold ${statusBadge(ord.estado)}">${escapeHtml(ord.estado)}</span>
                        </div>
                        <div class="text-xs text-[#666666] mt-0.5">
                          Cliente: <strong class="text-[#111111]">${escapeHtml(ord.cliente)}</strong> · Barrio: ${escapeHtml(ord.barrio)} · ${escapeHtml(ord.fecha)}
                        </div>
                      </div>
                      <div class="text-lg font-extrabold text-[#111111]">${formatARS(ord.total)}</div>
                    </div>

                    <div class="mt-3 space-y-1.5 text-xs">
                      ${itemsList.length > 0 ? itemsList.map(it => `
                        <div class="flex justify-between text-[#111111]">
                          <span>${it.cantidad || 1}x ${escapeHtml(it.nombre || 'Producto')}</span>
                          <span class="font-bold">${formatARS((it.precioUnitario || it.precio || 0) * (it.cantidad || 1))}</span>
                        </div>
                      `).join('') : `<div class="text-[#666666]">Pedido registrado</div>`}
                      ${ord.direccion ? `<div class="text-[#666666] pt-1">Dirección: ${escapeHtml(ord.direccion)}</div>` : ''}
                      ${ord.nota ? `<div class="text-amber-800 bg-amber-50 px-3 py-1.5 rounded-lg mt-1">Nota: ${escapeHtml(ord.nota)}</div>` : ''}
                    </div>

                    <div class="mt-4 pt-3 border-t border-slate-100 flex items-center gap-2 flex-wrap">
                      <button type="button" onclick="window.__vendorSetOrderStatus('${ord.id}', 'Confirmado')" class="min-h-[40px] px-3.5 py-1.5 rounded-xl bg-blue-600 text-white text-xs font-bold">
                        Confirmar
                      </button>
                      <button type="button" onclick="window.__vendorSetOrderStatus('${ord.id}', 'Entregado')" class="min-h-[40px] px-3.5 py-1.5 rounded-xl bg-[#2E7D32] text-white text-xs font-bold">
                        Marcar entregado
                      </button>
                      <button type="button" onclick="window.__vendorSetOrderStatus('${ord.id}', 'Cancelado')" class="min-h-[40px] px-3.5 py-1.5 rounded-xl bg-slate-100 text-[#E53935] text-xs font-bold">
                        Cancelar
                      </button>
                      <button type="button" onclick="window.__vendorContactOrderClient('${ord.id}')" class="ml-auto min-h-[40px] px-3.5 py-1.5 rounded-xl bg-[#25D366] text-white text-xs font-bold flex items-center gap-1">
                        <span>💬 Contactar por WhatsApp</span>
                      </button>
                    </div>
                  </article>
                `;
              }).join('')}
            </div>
          ` : `
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-8 text-center text-sm text-[#666666]">
              No hay pedidos que coincidan con este filtro.
            </div>
          `}
        </div>
      `;

    window.__vendorUploadProductPhotos = async (event) => {

      if (!files.length || !ui.productFormDraft) return;
      for (const f of files) {

    window.__vendorRemoveProductPhoto = (idx) => {
      if (!ui.productFormDraft || !Array.isArray(ui.productFormDraft.fotos)) return;
      ui.productFormDraft.fotos.splice(idx, 1);
      render();
    };

    window.__vendorMoveProductPhoto = (idx, dir) => {
      if (!ui.productFormDraft || !Array.isArray(ui.productFormDraft.fotos)) return;
      const target = idx + dir;
      if (target < 0 || target >= ui.productFormDraft.fotos.length) return;
      const arr = ui.productFormDraft.fotos;
      const tmp = arr[idx];
      arr[idx] = arr[target];
      arr[target] = tmp;
      render();
    };

    window.__vendorMoveProduct = (prodId, dir) => {
      const idx = db.productos.findIndex(p => p.id === prodId);
      if (idx === -1) return;
      const prod = db.productos[idx];
      const sameStoreIndices = db.productos
        .map((p, i) => (p.tiendaId === prod.tiendaId ? i : -1))
        .filter(i => i !== -1);
      const posInStore = sameStoreIndices.indexOf(idx);
      const targetPos = posInStore + dir;
      if (targetPos < 0 || targetPos >= sameStoreIndices.length) return;
      const swapIdx = sameStoreIndices[targetPos];
      const tmp = db.productos[idx];
      db.productos[idx] = db.productos[swapIdx];
      db.productos[swapIdx] = tmp;
      saveState(db);
      render();
    };

    window.__vendorToggleProductOffer = (prodId) => {
      const prod = db.productos.find(p => p.id === prodId);
      if (!prod) return;
      const existingIdx = db.ofertas.findIndex(o => o.productoId === prod.id);
      if (existingIdx !== -1 || prod.precioOferta) {
        const removed = existingIdx !== -1 ? db.ofertas[existingIdx] : null;
        if (existingIdx !== -1) db.ofertas.splice(existingIdx, 1);
        prod.precioOferta = null;
        saveState(db);
        syncProductToSheet(prod);
        if (removed) syncOfferToSheet(removed, 'delete');
        showToast('Oferta quitada.', 'info');
      } else {
        const offerPrice = Math.max(100, Math.round(prod.precio * 0.8));
        prod.precioOferta = offerPrice;
        const newOffer = {
          id: 'of-' + Date.now(),
          productoId: prod.id,
          tiendaId: prod.tiendaId,
          precioOferta: offerPrice,
          hastaCuando: Date.now() + 4 * 60 * 60 * 1000,
          destacada: false
        };
        db.ofertas.unshift(newOffer);
        saveState(db);
        syncProductToSheet(prod);
        syncOfferToSheet(newOffer);
        showToast(`¡Oferta activada a ${formatARS(offerPrice)} (-20%)!`, 'success');

      render();
    };
