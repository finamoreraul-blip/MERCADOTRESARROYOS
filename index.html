    function isTemplateStore(store) {
      if (!store) return false;
      return Boolean(
        store.esPlantillaDemo ||
        store.id === DEMO_TEMPLATE_ID ||
        String(store.email || '').trim().toLowerCase() === DEMO_TEMPLATE_EMAIL
      );
    }

    function ensureDemoTemplateExists() {
      const todayISO = new Date().toISOString().split('T')[0];
      const existingIdx = db.tiendas.findIndex(t => t.id === DEMO_TEMPLATE_ID);
      if (existingIdx === -1) {
        db.tiendas.unshift(createDemoTemplateStore(todayISO));
      } else {
        const current = db.tiendas[existingIdx];
        db.tiendas[existingIdx] = {
          ...createDemoTemplateStore(todayISO),
          ...current,
          id: DEMO_TEMPLATE_ID,
          slug: 'plantilla-emprendedor-demo',
          email: DEMO_TEMPLATE_EMAIL,
          password: DEMO_TEMPLATE_PASS,
          esPlantillaDemo: true,
          estadoSuscripcion: 'ACTIVA'
        };
      }

      const templateProds = db.productos.filter(p => p.tiendaId === DEMO_TEMPLATE_ID);
      if (templateProds.length === 0) {
        db.productos = [...createDemoTemplateProducts(), ...db.productos];
      }
    }

    function restoreDemoTemplate() {
      const todayISO = new Date().toISOString().split('T')[0];
      const freshTemplate = createDemoTemplateStore(todayISO);
      const freshProds = createDemoTemplateProducts();

      db.tiendas = db.tiendas.filter(t => t.id !== DEMO_TEMPLATE_ID);
      db.tiendas.unshift(freshTemplate);

      db.productos = db.productos.filter(p => p.tiendaId !== DEMO_TEMPLATE_ID);
      db.productos = [...freshProds, ...db.productos];

      db.ofertas = db.ofertas.filter(o => o.id !== 'of-plantilla-1' && o.productoId !== 'prod-plantilla-1');
      db.ofertas.unshift({
        id: 'of-plantilla-1',
        productoId: 'prod-plantilla-1',
        precioOferta: 14500,
        hastaCuando: Date.now() + 4 * 60 * 60 * 1000,
        destacada: false
      });

      if (ui.session && ui.session.role === 'VENDOR' && ui.session.storeId === DEMO_TEMPLATE_ID) {
        ui.showProductForm = false;
        ui.productFormDraft = null;
      }

      saveState(db);
      showToast('Plantilla de demostración restaurada y lista para usar.', 'success');
      render();
    }

    function materializeOwnStoreFromTemplate(templateStore, newFields) {
      const newEmail = String(newFields.email || '').trim().toLowerCase();
      const newPass = String(newFields.password || '').trim();
      const newName = String(newFields.nombre || '').trim().toUpperCase();

      const credentialsChanged =
        (newEmail && newEmail !== DEMO_TEMPLATE_EMAIL) ||
        (newPass && newPass !== DEMO_TEMPLATE_PASS);

      const identityChanged =
        (newName && newName !== templateStore.nombre) ||
        (String(newFields.whatsapp || '').trim() && String(newFields.whatsapp || '').trim() !== templateStore.whatsapp) ||
        (String(newFields.rubro || '').trim() && String(newFields.rubro || '').trim() !== templateStore.rubro);

      if (!credentialsChanged && !identityChanged) {
        return { cloned: false, store: templateStore };
      }

      const ownId = 'tienda-' + Date.now();
      const baseSlug = slugify(newName || templateStore.nombre || 'mi-tienda');
      const uniqueSlug = db.tiendas.some(t => t.slug === baseSlug)
        ? `${baseSlug}-${Math.floor(10 + Math.random() * 89)}`
        : baseSlug;

      const ownStore = {
        ...templateStore,
        id: ownId,
        slug: uniqueSlug,
        esPlantillaDemo: false,
        nombre: newName || templateStore.nombre,
        dueno: newName ? newName.charAt(0) + newName.slice(1).toLowerCase() : templateStore.dueno,
        email: newEmail || DEMO_TEMPLATE_EMAIL,
        password: newPass || DEMO_TEMPLATE_PASS,
        antiguedadTexto: 'Nueva tienda en Tres Arroyos',
        fechaRegistro: new Date().toISOString().split('T')[0],
        estadoSuscripcion: 'ACTIVA',
        ...newFields,
        id: ownId,
        slug: uniqueSlug,
        esPlantillaDemo: false,
        email: newEmail || DEMO_TEMPLATE_EMAIL,
        password: newPass || DEMO_TEMPLATE_PASS,
        nombre: newName || templateStore.nombre
      };

      const currentTemplateProds = db.productos.filter(p => p.tiendaId === DEMO_TEMPLATE_ID);
      const idMap = new Map();
      const clonedProds = currentTemplateProds.map((p, idx) => {
        const newProdId = `prod-${Date.now()}-${idx}`;
        idMap.set(p.id, newProdId);
        return {
          ...p,
          id: newProdId,
          tiendaId: ownId,
          categoria: ownStore.rubro || p.categoria,
          fotos: Array.isArray(p.fotos) ? [...p.fotos] : [SAMPLE_FALLBACK_PHOTO]
        };
      });

      const clonedOffers = db.ofertas
        .filter(o => idMap.has(o.productoId))
        .map((o, idx) => ({
          ...o,
          id: `of-${Date.now()}-${idx}`,
          productoId: idMap.get(o.productoId)
        }));

      const clonedOrders = db.pedidos
        .filter(o => o.tiendaId === DEMO_TEMPLATE_ID)
        .map((o, idx) => ({
          ...o,
          id: `PED-${Math.floor(2000 + Math.random() * 7999)}-${idx}`,
          tiendaId: ownId,
          tiendaNombre: ownStore.nombre
        }));

      const freshTemplate = createDemoTemplateStore(new Date().toISOString().split('T')[0]);
      const freshTemplateProds = createDemoTemplateProducts();

      db.tiendas = [
        freshTemplate,
        ownStore,
        ...db.tiendas.filter(t => t.id !== DEMO_TEMPLATE_ID)
      ];

      db.productos = [
        ...freshTemplateProds,
        ...clonedProds,
        ...db.productos.filter(p => p.tiendaId !== DEMO_TEMPLATE_ID)
      ];

      db.ofertas = [
        {
          id: 'of-plantilla-1',
          productoId: 'prod-plantilla-1',
          precioOferta: 14500,
          hastaCuando: Date.now() + 4 * 60 * 60 * 1000,
          destacada: false
        },
        ...clonedOffers,
        ...db.ofertas.filter(o => !idMap.has(o.productoId) && o.id !== 'of-plantilla-1')
      ];

      db.pedidos = [
        ...clonedOrders,
        ...db.pedidos.filter(o => o.tiendaId !== DEMO_TEMPLATE_ID)
      ];

      ui.session = { role: 'VENDOR', storeId: ownId };
      saveState(db);
      pushToSheet('registerStore', { tienda: ownStore, productoInicial: clonedProds[0] || null });

      return { cloned: true, store: ownStore };
    }

    // ==================== INTEGRACIÓN GOOGLE SHEETS (APPS SCRIPT - MAYÚSCULAS) ====================
    function parseBool(val, fallback = false) {
      if (typeof val === 'boolean') return val;
      if (typeof val === 'number') return val !== 0;
      if (typeof val === 'string') {
        const s = val.trim().toLowerCase();
        if (s === 'true' || s === '1' || s === 'sí' || s === 'si') return true;
        if (s === 'false' || s === '0' || s === 'no') return false;
      }
      return fallback;
    }

    function parseListField(val, fallback = []) {
      if (Array.isArray(val)) return val;
      if (typeof val === 'string' && val.trim()) {
        try {
          const parsed = JSON.parse(val);
          if (Array.isArray(parsed)) return parsed;
        } catch (_) {}
        return val.split(',').map(s => s.trim()).filter(Boolean);
      }
      return fallback;
    }

    function sanitizeSheetMedia(val, fallback = '') {
      if (!val || typeof val !== 'string') return fallback;
      if (val.startsWith('data:image/') && val.length > 45000) {
        return fallback;
      }
      return val;
    }

    function pickField(row, keys, fallback = '') {
      for (let i = 0; i < keys.length; i++) {
        const k = keys[i];
        if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== '') {
          return row[k];
        }
      }
      return fallback;
    }

    function normalizeSheetStore(row) {
      if (!row || typeof row !== 'object') return null;
      const nombre = String(pickField(row, ['Nombre', 'nombre'], '')).trim();
      const rawId = String(pickField(row, ['ID', 'id'], '')).trim();
      if (!rawId && !nombre) return null;
      const finalName = nombre || 'Tienda local';
      const id = rawId || ('tienda-' + slugify(finalName));
      const envioFlag = parseBool(pickField(row, ['Envío', 'Envio', 'haceEnvios'], true), true);
      const metodosRaw = pickField(row, ['Métodos pago', 'Metodos pago', 'metodosPago'], ['Efectivo', 'Transferencia']);

      return {
        id,
        slug: slugify(finalName),
        nombre: finalName,
        dueno: finalName,
        email: String(pickField(row, ['Email', 'email'], '')).trim(),
        password: String(pickField(row, ['Contraseña', 'Contrasena', 'password'], '123456')),
        esPlantillaDemo: id === DEMO_TEMPLATE_ID,
        rubro: String(pickField(row, ['Rubro', 'rubro', 'categoria'], 'Otros')).trim(),
        barrio: String(pickField(row, ['Barrio', 'barrio'], 'Centro')).trim(),
        direccion: String(pickField(row, ['Dirección', 'Direccion', 'direccion'], '')).trim(),
        whatsapp: String(pickField(row, ['WhatsApp', 'Whatsapp', 'whatsapp'], '')).trim(),
        instagram: String(pickField(row, ['Instagram', 'instagram'], '')).trim(),
        logo: String(pickField(row, ['Logo', 'logo'], '')).trim() || makeSvgFallbackDataUri(finalName, '#1A2A44'),
        portada: String(pickField(row, ['Portada', 'portada'], '')).trim() || makeSvgFallbackDataUri(finalName, '#2E7D32'),
        descripcion: String(pickField(row, ['Descripción', 'Descripcion', 'descripcion'], '')).trim(),
        antiguedadTexto: 'En Tres Arroyos',
        rating: 4.9,
        reviewCount: 0,
        fiveStarCount: 0,
        salesCount: 1,
        verificado: parseBool(pickField(row, ['Verificado', 'verificado'], false), false),
        abiertoAhora: true,
        horarioTexto: String(pickField(row, ['Horarios', 'Horarios ', 'horarioTexto'], 'Lun a Sáb 9 a 20')).trim(),
        haceEnvios: envioFlag,
        envioHoy: envioFlag,
        precioEnvio: 1500,
        envioGratisDesde: 0,
        aceptaEncargo: false,
        metodosPago: parseListField(metodosRaw, ['Efectivo', 'Transferencia']),
        estadoSuscripcion: String(pickField(row, ['Estado', 'estado', 'estadoSuscripcion'], 'ACTIVA')).toUpperCase(),
        fechaRegistro: String(pickField(row, ['Fecha registro', 'Fecha Registro', 'fechaRegistro'], new Date().toISOString().split('T')[0])),
        horariosSemana: makeDefaultHours('09:00', '20:00', false)
      };
    }

    function normalizeSheetProduct(row) {
      if (!row || typeof row !== 'object') return null;
      const nombre = String(pickField(row, ['Nombre', 'nombre'], '')).trim();
      const rawId = String(pickField(row, ['ID', 'id'], '')).trim();
      if (!rawId && !nombre) return null;
      const finalName = nombre || 'Producto';
      const rawFotos = parseListField(pickField(row, ['Fotos', 'fotos'], []), []);
      const fotos = rawFotos.length > 0 ? rawFotos : [SAMPLE_FALLBACK_PHOTO];
      const precio = Number(pickField(row, ['Precio', 'precio'], 0)) || 0;
      const rawOffer = pickField(row, ['Precio oferta', 'Precio Oferta', 'precioOferta'], '');
      const precioOferta = rawOffer !== '' && Number(rawOffer) > 0 ? Number(rawOffer) : null;
      const rawCant = pickField(row, ['Cantidad', 'cantidad', 'cantidadStock'], '');

      return {
        id: rawId || ('prod-' + slugify(finalName)),
        tiendaId: String(pickField(row, ['TiendaID', 'tiendaId', 'tienda_id'], '')).trim(),
        nombre: finalName,
        precio,
        precioOferta,
        esNuevo: parseBool(pickField(row, ['Nuevo', 'nuevo', 'esNuevo'], false), false),
        stockDisponible: parseBool(pickField(row, ['Stock', 'stock', 'stockDisponible'], true), true),
        cantidadStock: rawCant !== '' ? Number(rawCant) : null,
        categoria: String(pickField(row, ['Categoría', 'Categoria', 'categoria'], 'Otros')).trim(),
        descripcion: String(pickField(row, ['Descripción', 'Descripcion', 'descripcion'], '')).trim(),
        fotos
      };
    }

    function buildSheetStoreRecord(store) {
      return {
        ID: store.id,
        Nombre: store.nombre || '',
        Rubro: store.rubro || 'Otros',
        Barrio: store.barrio || 'Centro',
        WhatsApp: store.whatsapp || '',
        Logo: sanitizeSheetMedia(store.logo, ''),
        Portada: sanitizeSheetMedia(store.portada, ''),
        Descripción: store.descripcion || '',
        Horarios: store.horarioTexto || '',
        Envío: Boolean(store.haceEnvios),
        Estado: store.estadoSuscripcion || 'ACTIVA',
        'Días gratis': store.diasGratis ?? '',
        'Fecha registro': store.fechaRegistro || new Date().toISOString().slice(0, 10),
        Verificado: Boolean(store.verificado),
        Recomendado: Boolean(isRecommendedStore(store)),
        Email: store.email || '',
        Contraseña: store.password || '',
        Instagram: store.instagram || '',
        Dirección: store.direccion || '',
        'Métodos pago': Array.isArray(store.metodosPago) ? store.metodosPago : []
      };
    }

    function buildSheetProductRecord(product) {
      const safePhotos = Array.isArray(product.fotos)
        ? product.fotos.map(f => sanitizeSheetMedia(f, '')).filter(Boolean)
        : [];
      return {
        ID: product.id,
        TiendaID: product.tiendaId || '',
        Nombre: product.nombre || '',
        Precio: Number(product.precio) || 0,
        'Precio oferta': product.precioOferta ? Number(product.precioOferta) : '',
        Descripción: product.descripcion || '',
        Fotos: safePhotos,
        Categoría: product.categoria || 'Otros',
        Stock: Boolean(product.stockDisponible),
        Cantidad: product.cantidadStock ?? '',
        Nuevo: Boolean(product.esNuevo),
        Orden: product.orden ?? 0
      };
    }

    function buildSheetOrderRecord(order) {
      const itemsSummary = Array.isArray(order.items)
        ? order.items.map(i => `${i.cantidad || 1}x ${i.nombre}`).join(', ')
        : (order.resumenItems || '');
      return {
        ID: order.id,
        TiendaID: order.tiendaId || '',
        Cliente: order.cliente || '',
        Teléfono: order.telefono || '',
        Productos: itemsSummary,
        Total: Number(order.total) || 0,
        Fecha: order.fecha || new Date().toISOString(),
        Estado: order.estado || 'Nuevo',
        Barrio: order.barrio || '',
        Dirección: order.direccion || '',
        Nota: order.nota || ''
      };
    }

    function buildSheetReviewRecord(review) {
      return {
        ID: review.id,
        TiendaID: review.tiendaId || '',
        Cliente: review.cliente || '',
        Estrellas: Number(review.estrellas) || 5,
        Comentario: review.comentario || '',
        Foto: sanitizeSheetMedia(review.fotoProducto, ''),
        Fecha: review.fecha || new Date().toISOString().slice(0, 10)
      };
    }

    function mergeSheetDataIntoState(payload) {
      if (!payload || typeof payload !== 'object') return false;
      const data = payload.data && typeof payload.data === 'object' ? payload.data : payload;

      const sheetStoresRaw = Array.isArray(data.Tiendas) ? data.Tiendas : (Array.isArray(data.tiendas) ? data.tiendas : null);
      const sheetProdsRaw = Array.isArray(data.Productos) ? data.Productos : (Array.isArray(data.productos) ? data.productos : null);

      let changed = false;

      if (sheetStoresRaw && sheetStoresRaw.length > 0) {
        const normalizedStores = sheetStoresRaw.map(normalizeSheetStore).filter(Boolean);
        if (normalizedStores.length > 0) {
          const byId = new Map();
          db.tiendas.forEach(s => byId.set(s.id, s));
          normalizedStores.forEach(s => byId.set(s.id, s));
          db.tiendas = Array.from(byId.values());
          changed = true;
        }
      }

      if (sheetProdsRaw && sheetProdsRaw.length > 0) {
        const normalizedProds = sheetProdsRaw.map(normalizeSheetProduct).filter(Boolean);
        if (normalizedProds.length > 0) {
          const byProdId = new Map();
          db.productos.forEach(p => byProdId.set(p.id, p));
          normalizedProds.forEach(p => byProdId.set(p.id, p));
          db.productos = Array.from(byProdId.values());
          changed = true;
        }
      }

      if (changed) {
        ensureDemoTemplateExists();
        saveState(db);
      }
      return changed;
    }

    async function fetchSheetDataOnLoad() {
      if (!SHEET_WEBAPP_URL) return;
      try {
        const sep = SHEET_WEBAPP_URL.includes('?') ? '&' : '?';
        const res = await fetch(`${SHEET_WEBAPP_URL}${sep}t=${Date.now()}`, {
          method: 'GET',
          cache: 'no-store'
        });
        if (!res.ok) return;
        const json = await res.json();
        const updated = mergeSheetDataIntoState(json);
        if (updated) {
          render();
        }
      } catch (_) {
        // Sin conexión o CORS en entorno local: mantiene estado local sin interrumpir
      }
    }

    async function postEntityRecord(entity, record, action = 'upsert') {
      if (!SHEET_WEBAPP_URL || !entity || !record) return false;
      try {
        await fetch(SHEET_WEBAPP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action,
            entity,
            data: record
          })
        });
        return true;
      } catch (err) {
        console.warn('No se pudo enviar a Google Sheets:', err);
        return false;
      }
    }

    async function pushToSheet(action, dataPayload) {
      if (!SHEET_WEBAPP_URL || !dataPayload) return false;

      if (action === 'registerStore' || action === 'updateStore') {
        const storeObj = dataPayload.tienda || dataPayload;
        await postEntityRecord('Tiendas', buildSheetStoreRecord(storeObj), 'upsert');
        if (dataPayload.productoInicial) {
          await postEntityRecord('Productos', buildSheetProductRecord(dataPayload.productoInicial), 'upsert');
        }
        return true;
      }

      if (action === 'updateStoreStatus') {
        const existing = getStoreById(dataPayload.id);
        if (existing) {
          await postEntityRecord('Tiendas', buildSheetStoreRecord({ ...existing, estadoSuscripcion: dataPayload.estadoSuscripcion }), 'upsert');
        }
        return true;
      }

      if (action === 'saveProduct') {
        await postEntityRecord('Productos', buildSheetProductRecord(dataPayload), 'upsert');
        return true;
      }

      if (action === 'deleteProduct') {
        await postEntityRecord('Productos', { ID: dataPayload.id }, 'delete');
        return true;
      }

      if (action === 'createOrder') {
        await postEntityRecord('Pedidos', buildSheetOrderRecord(dataPayload), 'upsert');
        return true;
      }

      if (action === 'updateOrderStatus') {
        const existingOrder = db.pedidos.find(o => o.id === dataPayload.id);
        if (existingOrder) {
          await postEntityRecord('Pedidos', buildSheetOrderRecord({ ...existingOrder, estado: dataPayload.estado }), 'upsert');
        }
        return true;
      }

      if (action === 'createReview') {
        await postEntityRecord('Reseñas', buildSheetReviewRecord(dataPayload), 'upsert');
        return true;
      }

      return false;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const initial = createInitialDatabase();
          saveState(initial);
          return initial;
        }
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.tiendas) || parsed.tiendas.length === 0 || !Array.isArray(parsed.productos)) {
          const initial = createInitialDatabase();
          saveState(initial);
          return initial;
        }
        return {
          tiendas: parsed.tiendas,
          productos: parsed.productos,
          ofertas: Array.isArray(parsed.ofertas) ? parsed.ofertas : [],
          resenas: Array.isArray(parsed.resenas) ? parsed.resenas : [],
          pedidos: Array.isArray(parsed.pedidos) ? parsed.pedidos : [],
          carrito: Array.isArray(parsed.carrito) ? parsed.carrito : [],
          favoritos: Array.isArray(parsed.favoritos) ? parsed.favoritos : [],
          misPedidosCliente: Array.isArray(parsed.misPedidosCliente) ? parsed.misPedidosCliente : []
        };
      } catch (err) {
        console.warn('Error leyendo estado local, inicializando demo:', err);
        const fallback = createInitialDatabase();
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(fallback)); } catch (_) {}

    function formatARS(num) {

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function slugify(text) {
      return String(text || 'tienda')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '') || 'tienda-' + Date.now();

        info: 'bg-[#1A2A44] text-white'
      };
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-sm font-semibold flex items-center justify-between gap-3 transition-all ${bgMap[type] || bgMap.info}`;
      toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {

    function copyToClipboard(text, successMsg = '¡Copiado al portapapeles!') {
      try {
        const temp = document.createElement('textarea');
        temp.value = text;
        temp.setAttribute('readonly', '');
        temp.style.position = 'absolute';
        temp.style.left = '-9999px';
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        showToast(successMsg, 'success');
      } catch (_) {
        showToast('No se pudo copiar automáticamente.', 'error');
      }

    function normalizeWhatsAppPhone(raw) {
      const digits = String(raw || '').replace(/\D/g, '');
      if (!digits) return SUPPORT_WHATSAPP;
      if (digits.startsWith('549')) return digits;
      if (digits.startsWith('54')) return '549' + digits.slice(2);
      if (digits.length === 10) return '549' + digits;
      return digits;
    }

    function buildWhatsAppLink(phone, message) {

      return `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;

      if (!bEl) return;
      const p = Number(pEl ? pEl.value : 0) || 0;

      if (o > 0 && p > 0 && o < p) {

    // Compresión liviana para no superar el límite de 50.000 chars por celda en Sheets
    function readImageFileAsDataUrl(file, maxWidth = 500, quality = 0.65) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) {
          reject(new Error('Seleccioná un archivo de imagen válido.'));
          return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              let w = img.width;
              let h = img.height;
              if (w > maxWidth) {
                h = Math.round((h * maxWidth) / w);
                w = maxWidth;
              }
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', quality));
            } catch (_) {
              resolve(ev.target.result);
            }
          };
          img.onerror = () => resolve(ev.target.result);
          img.src = ev.target.result;
        };
        reader.onerror = () => reject(new Error('No se pudo leer la foto de la galería.'));
        reader.readAsDataURL(file);
      });
    }

    // Consultas de negocio
    function getVisibleStores() {
      return db.tiendas.filter(t => t.estadoSuscripcion === 'ACTIVA');
    }

    function getStoreById(id) {
      return db.tiendas.find(t => t.id === id) || null;
    }

    function getStoreBySlug(slug) {
      return db.tiendas.find(t => t.slug === slug) || getVisibleStores()[0] || db.tiendas[0];
    }

    function getOfferForProduct(productId) {
      const now = Date.now();
      return db.ofertas.find(o => o.productoId === productId && (!o.hastaCuando || o.hastaCuando > now)) || null;
    }

    function getEffectivePrice(product) {
      const offer = getOfferForProduct(product.id);
      if (offer && offer.precioOferta && offer.precioOferta < product.precio) {
        return {
          finalPrice: Number(offer.precioOferta),
          originalPrice: Number(product.precio),
          hasOffer: true,
          discountPct: Math.max(1, Math.round(((product.precio - offer.precioOferta) / product.precio) * 100)),
          hastaCuando: offer.hastaCuando
        };
      }
      if (product.precioOferta && product.precioOferta < product.precio) {
        return {
          finalPrice: Number(product.precioOferta),
          originalPrice: Number(product.precio),
          hasOffer: true,
          discountPct: Math.max(1, Math.round(((product.precio - product.precioOferta) / product.precio) * 100)),
          hastaCuando: Date.now() + 4 * 60 * 60 * 1000
        };
      }
      return {
        finalPrice: Number(product.precio),
        originalPrice: Number(product.precio),
        hasOffer: false,
        discountPct: 0,
        hastaCuando: null
      };
    }

    function getRemainingCountdownText(hastaCuando) {
      if (!hastaCuando) return 'Termina hoy 20:00';
      const diffMs = Math.max(0, hastaCuando - Date.now());
      const hours = Math.floor(diffMs / (1000 * 60 * 60));
      const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
      if (hours <= 0 && mins <= 0) return 'Termina hoy 20:00';
      return `Quedan ${Math.max(1, hours)} hs ${mins > 0 ? `${mins}m` : ''}`;
    }

    function isRecommendedStore(store) {
      const storeReviews = db.resenas.filter(r => r.tiendaId === store.id && r.estrellas === 5).length;
      return (store.fiveStarCount || 0) >= 20 || storeReviews >= 20;
    }

    function matchesCategoryFilter(itemCat, filterCat) {
      if (!filterCat || filterCat === 'Todas') return true;
      const a = String(itemCat || '').toLowerCase();
      const b = String(filterCat || '').toLowerCase();
      if (a === b) return true;
      if (b === 'ropa') return a.includes('ropa') || a.includes('calzado');
      if (b === 'hogar') return a.includes('hogar') || a.includes('deco');
      if (b === 'regalos') return a.includes('regalo') || a.includes('artesan');
      return a.includes(b) || b.includes(a);
    }

    // Carrito
    function addToCart(productId, qty = 1) {
      const prod = db.productos.find(p => p.id === productId);
      if (!prod) return;
      if (!prod.stockDisponible) {
        showToast('Este producto está AGOTADO por el momento.', 'error');
        return;
      }
      const store = getStoreById(prod.tiendaId);
      if (!store) return;

      const pricing = getEffectivePrice(prod);
      const existing = db.carrito.find(item => item.productoId === prod.id);
      if (existing) {
        existing.cantidad += qty;
        existing.precio = pricing.finalPrice;
      } else {
        db.carrito.push({
          productoId: prod.id,
          tiendaId: store.id,
          tiendaNombre: store.nombre,
          nombre: prod.nombre,
          precio: pricing.finalPrice,
          cantidad: qty,
          foto: (prod.fotos && prod.fotos[0]) || store.logo || SAMPLE_FALLBACK_PHOTO
        });
      }
      saveState(db);
      showToast(`Agregaste "${prod.nombre}" al carrito.`, 'success');
      render();
    }

    function updateCartQty(productoId, delta) {
      const idx = db.carrito.findIndex(item => item.productoId === productoId);
      if (idx === -1) return;
      db.carrito[idx].cantidad += delta;
      if (db.carrito[idx].cantidad <= 0) {
        db.carrito.splice(idx, 1);
      }
      saveState(db);
      render();
    }

    // 2. SECCIÓN TIENDAS
    function renderStoresDirectory() {
      const catChips = ['Todas', 'Comida', 'Dulces', 'Ropa', 'Belleza', 'Hogar', 'Regalos', 'Mascotas'];
      const q = (ui.searchQuery || '').trim().toLowerCase();

      let list = getVisibleStores().filter(st => {
        if (!matchesCategoryFilter(st.rubro, ui.selectedCategory)) return false;
        if (ui.selectedBarrio !== 'Todos' && st.barrio !== ui.selectedBarrio) return false;
        if (ui.soloAbierto && !st.abiertoAhora) return false;
        if (ui.soloEnvios && !st.haceEnvios) return false;
        if (ui.soloOfertas) {
          const hasOff = db.productos.some(p => p.tiendaId === st.id && getEffectivePrice(p).hasOffer);
          if (!hasOff) return false;
        }
        if (q) {
          const prodMatch = db.productos.some(p => p.tiendaId === st.id && (p.nombre || '').toLowerCase().includes(q));
          const stMatch = (st.nombre || '').toLowerCase().includes(q) ||
            (st.rubro || '').toLowerCase().includes(q) ||
            (st.barrio || '').toLowerCase().includes(q);
          if (!stMatch && !prodMatch) return false;
        }
        return true;
      });

      if (ui.sortBy === 'mas_vendidas') {
        list.sort((a, b) => (b.salesCount || 0) - (a.salesCount || 0));
      } else if (ui.sortBy === 'mas_nuevas') {
        list.sort((a, b) => String(b.fechaRegistro || '').localeCompare(String(a.fechaRegistro || '')));
      } else if (ui.sortBy === 'mejor_puntuadas') {
        list.sort((a, b) => (b.rating || 0) - (a.rating || 0));
      } else if (ui.sortBy === 'cerca_mio') {
        const orderB = ['Centro', 'La Cañada', 'Cooperativa', 'Villa Italia', 'Ranchos', 'Otros'];
        list.sort((a, b) => orderB.indexOf(a.barrio) - orderB.indexOf(b.barrio));

      return `

                <option value="mas_nuevas" ${ui.sortBy === 'mas_nuevas' ? 'selected' : ''}>Más nuevas</option>

    // 4. SECCIÓN OFERTAS DEL DÍA
    function renderOffersPage() {

      const offersList = db.productos.filter(p => {
        const st = visibleMap.get(p.tiendaId);
        if (!st || isTemplateStore(st)) return false;
        if (!getEffectivePrice(p).hasOffer) return false;
        if (!matchesCategoryFilter(p.categoria, ui.offersCategory)) return false;
        if (ui.offersBarrio !== 'Todos' && st.barrio !== ui.offersBarrio) return false;
        return true;
      });

      return `

    // 5. CARRITO POR WHATSAPP
    function renderCartDrawer() {
      if (!ui.cartOpen) return '';

      const byStore = new Map();
      db.carrito.forEach(item => {
        if (!byStore.has(item.tiendaId)) {
          byStore.set(item.tiendaId, []);
        }
        byStore.get(item.tiendaId).push(item);
      });

      const subtotalGeneral = db.carrito.reduce((sum, it) => sum + it.precio * it.cantidad, 0);
      let totalShipping = 0;
      byStore.forEach((items, storeId) => {

      return `
        <div class="space-y-5">

          ${ui.showProductForm && ui.productFormDraft ? renderVendorProductForm(store, ui.productFormDraft) : ''}

          ${filtered.length > 0 ? `

                        <div class="flex items-center gap-2 flex-wrap">
                          <span class="font-extrabold text-sm sm:text-base text-[#111111] truncate">${escapeHtml(p.nombre)}</span>
                          ${pricing.hasOffer ? `<span class="px-2 py-0.5 rounded-md bg-[#E53935] text-white text-[10px] font-extrabold">-${pricing.discountPct}%</span>` : ''}

                          <span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold ${p.stockDisponible ? 'bg-emerald-50 text-[#2E7D32]' : 'bg-slate-200 text-[#666666]'}">

                    <div class="flex items-center gap-1.5 flex-wrap">
                      ${idx > 0 ? `<button type="button" onclick="window.__vendorMoveProduct('${p.id}', -1)" class="min-h-[38px] px-2.5 py-1.5 rounded-xl bg-slate-100 text-xs font-bold">↑</button>` : ''}
                      ${idx < filtered.length - 1 ? `<button type="button" onclick="window.__vendorMoveProduct('${p.id}', 1)" class="min-h-[38px] px-2.5 py-1.5 rounded-xl bg-slate-100 text-xs font-bold">↓</button>` : ''}

            </div>
          `}
        </div>
      `;

    // Formulario de producto: actualiza estado y vistas previas en vivo SIN llamar a render() al escribir

      return `

              </label>
            </div>

            <div class="grid grid-cols-3 gap-3">
              ${photos.slice(0, 3).map((ph, i) => `
                <div class="relative aspect-square rounded-2xl overflow-hidden bg-white border border-slate-200">
                  ${renderSafeImage(ph, draft.nombre || 'Foto')}
                  <span class="absolute bottom-1.5 left-1.5 px-2 py-0.5 rounded-md text-[10px] font-extrabold ${i === 0 ? 'bg-[#1A2A44] text-white' : 'bg-black/65 text-white'}">
                    ${i === 0 ? 'Principal' : `Foto ${i + 1}`}

    function renderVendorTabMyOrders(store, myOrders, newOrdersCount) {
      const filtered = myOrders.filter(o => {
        if (ui.vendorOrderStatusFilter !== 'Todos' && o.estado !== ui.vendorOrderStatusFilter) return false;

      const statusBadge = (st) => {
        if (st === 'Nuevo') return 'bg-amber-100 text-amber-800';

      return `

              <button type="button" onclick="window.__vendorMarkAllOrdersSeen('${store.id}')" class="text-xs font-bold text-[#1A2A44] underline">Marcar vistos</button>

                <option value="Todos" ${ui.vendorOrderDateFilter === 'Todos' ? 'selected' : ''}>Todos</option>
                <option value="Hoy" ${ui.vendorOrderDateFilter === 'Hoy' ? 'selected' : ''}>Hoy</option>
                <option value="Esta semana" ${ui.vendorOrderDateFilter === 'Esta semana' ? 'selected' : ''}>Esta semana</option>

              <select onchange="ui.vendorOrderStatusFilter = this.value; render();" class="min-h-[44px] px-3 rounded-xl border border-slate-300 bg-white text-xs font-bold">
                <option value="Todos" ${ui.vendorOrderStatusFilter === 'Todos' ? 'selected' : ''}>Todos los estados</option>
                <option value="Nuevo" ${ui.vendorOrderStatusFilter === 'Nuevo' ? 'selected' : ''}>Nuevo</option>
                <option value="Confirmado" ${ui.vendorOrderStatusFilter === 'Confirmado' ? 'selected' : ''}>Confirmado</option>
                <option value="Entregado" ${ui.vendorOrderStatusFilter === 'Entregado' ? 'selected' : ''}>Entregado</option>

          ${filtered.length > 0 ? `
            <div class="space-y-4">
              ${filtered.map(ord => {
                const firstThumb = (ord.items && ord.items[0] && ord.items[0].foto) || store.logo || SAMPLE_FALLBACK_PHOTO;
                const itemsText = (ord.items || []).map(i => `${i.cantidad}x ${i.nombre}`).join(', ');
                const summaryCopy = `Pedido ${ord.id} · ${ord.cliente} (${ord.barrio}, ${ord.direccion}) · ${itemsText} · Total ${formatARS(ord.total)}`;

                return `
                  <article class="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 space-y-3">
                    <div class="flex items-start justify-between gap-3">
                      <div class="flex items-center gap-3 min-w-0">
                        <div class="w-14 h-14 rounded-xl overflow-hidden bg-slate-100 shrink-0">
                          ${renderSafeImage(firstThumb, ord.cliente)}
                        </div>
                        <div class="min-w-0">
                          <div class="flex items-center gap-2 flex-wrap">
                            <span class="font-extrabold text-sm text-[#111111]">${escapeHtml(ord.cliente)}</span>
                            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold ${statusBadge(ord.estado)}">${escapeHtml(ord.estado)}</span>
                          </div>
                          <div class="text-xs text-[#666666]">${escapeHtml(ord.fecha)} · 📍 ${escapeHtml(ord.barrio)} · ${escapeHtml(ord.direccion)}</div>
                          <div class="text-xs font-bold text-[#1A2A44] mt-0.5">${escapeHtml(itemsText)} · ${formatARS(ord.total)}</div>
                          ${ord.nota ? `<div class="text-xs text-[#666666] mt-0.5">Nota: ${escapeHtml(ord.nota)}</div>` : ''}
                        </div>
                      </div>
                    </div>

                    <div class="flex items-center gap-2 flex-wrap pt-2 border-t border-slate-100">
                      <button type="button" onclick="window.__vendorSetOrderStatus('${ord.id}', 'Confirmado')" class="min-h-[38px] px-3 py-1.5 rounded-xl bg-blue-50 text-blue-800 text-xs font-bold">Confirmado</button>
                      <button type="button" onclick="window.__vendorSetOrderStatus('${ord.id}', 'Entregado')" class="min-h-[38px] px-3 py-1.5 rounded-xl bg-emerald-50 text-[#2E7D32] text-xs font-bold">Entregado</button>
                      <button type="button" onclick="window.__vendorSetOrderStatus('${ord.id}', 'No retiró')" class="min-h-[38px] px-3 py-1.5 rounded-xl bg-red-50 text-[#E53935] text-xs font-bold">No retiró</button>
                      <button type="button" onclick="openWhatsAppUrl('${escapeHtml(store.whatsapp)}', \`${escapeHtml(summaryCopy)}\`)" class="min-h-[38px] px-3 py-1.5 rounded-xl bg-[#25D366] text-white text-xs font-bold">Ver en WhatsApp</button>
                      <button type="button" onclick="copyToClipboard(\`${escapeHtml(summaryCopy)}\`, 'Pedido copiado para WhatsApp')" class="min-h-[38px] px-3 py-1.5 rounded-xl bg-slate-100 text-[#111111] text-xs font-bold">Copiar pedido</button>

          ` : `
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-8 text-center">
              <p class="font-bold text-base text-[#111111]">Todavía no tenés pedidos.</p>

                Compartir mi tienda
              </button>
            </div>
          `}
        </div>
      `;

    function renderAdminTabStats() {
      const totalStores = db.tiendas.length;
      const activeStores = db.tiendas.filter(t => t.estadoSuscripcion === 'ACTIVA').length;
      const totalOrders = db.pedidos.length;

      const catCounts = {};
      db.productos.forEach(p => {
        const c = p.categoria || 'Otros';
        catCounts[c] = (catCounts[c] || 0) + 1;
      });
      const maxCatVal = Math.max(1, ...Object.values(catCounts));

      const topStores = [...db.tiendas]
        .sort((a, b) => (b.salesCount || 0) - (a.salesCount || 0))
        .slice(0, 5);

      return `
        <div class="space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white border border-slate-200 rounded-2xl p-5">
              <div class="text-xs font-bold text-[#666666]">Tiendas registradas</div>
              <div class="text-3xl font-extrabold text-[#1A2A44] mt-1">${totalStores}</div>
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl p-5">
              <div class="text-xs font-bold text-[#666666]">Tiendas activas</div>
              <div class="text-3xl font-extrabold text-[#2E7D32] mt-1">${activeStores}</div>
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl p-5">
              <div class="text-xs font-bold text-[#666666]">Pedidos enviados</div>
              <div class="text-3xl font-extrabold text-[#111111] mt-1">${totalOrders}</div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white border border-slate-200 rounded-2xl p-5">
              <h3 class="font-extrabold text-base text-[#1A2A44] mb-4">Productos por categoría</h3>
              <div class="space-y-3">
                ${Object.entries(catCounts).map(([cat, cnt]) => {
                  const pct = Math.round((cnt / maxCatVal) * 100);
                  return `
                    <div>
                      <div class="flex justify-between text-xs font-bold mb-1">
                        <span>${escapeHtml(cat)}</span>
                        <span>${cnt}</span>
                      </div>
                      <div class="h-3 rounded-full bg-slate-100 overflow-hidden">

    // EVENTOS DE FORMULARIOS Y ACCIONES
    function attachGlobalEvents() {
      const cartForm = document.getElementById('cart-checkout-form');
      if (cartForm) {
        cartForm.onsubmit = (e) => {
          e.preventDefault();
          const name = (document.getElementById('cart-customer-name')?.value || '').trim();
          const barrio = document.getElementById('cart-customer-barrio')?.value || 'Centro';
          const address = (document.getElementById('cart-customer-address')?.value || '').trim();
          const note = (document.getElementById('cart-customer-note')?.value || '').trim();

          if (!name || !address) {
            showToast('Completá tu nombre y dirección para enviar el pedido.', 'error');
            return;
          }

          const byStore = new Map();
          db.carrito.forEach(item => {
            if (!byStore.has(item.tiendaId)) byStore.set(item.tiendaId, []);
            byStore.get(item.tiendaId).push(item);
          });

          let firstWhatsAppUrl = '';
          const nowStr = 'Hoy ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });

          byStore.forEach((items, storeId) => {
            const st = getStoreById(storeId) || { id: storeId, nombre: 'Tienda', whatsapp: SUPPORT_WHATSAPP, haceEnvios: true, precioEnvio: 1500 };
            const sub = items.reduce((s, i) => s + i.precio * i.cantidad, 0);
            const ship = st.haceEnvios ? ((st.envioGratisDesde && sub >= st.envioGratisDesde) ? 0 : (Number(st.precioEnvio) || 0)) : 0;
            const tot = sub + ship;
            const orderId = 'PED-' + Math.floor(1000 + Math.random() * 9000);

            const newOrder = {
              id: orderId,
              tiendaId: st.id,
              tiendaNombre: st.nombre,
              cliente: name,
              barrio,
              direccion: address,
              nota: note || 'Sin nota adicional',
              fecha: nowStr,
              estado: 'Nuevo',
              esNuevoNoVisto: true,
              total: tot,
              items: items.map(i => ({ ...i }))
            };
            db.pedidos.unshift(newOrder);
            pushToSheet('createOrder', newOrder);

            const resumenItems = items.map(i => `${i.cantidad}x ${i.nombre} (${formatARS(i.precio * i.cantidad)})`).join(', ');
            db.misPedidosCliente.unshift({
              id: orderId,
              tiendaId: st.id,
              tiendaNombre: st.nombre,
              total: tot,
              resumenItems,
              items: items.map(i => ({ productoId: i.productoId, cantidad: i.cantidad }))
            });

            const lines = [
              `Hola ${st.nombre}! Quiero hacer este pedido desde Mercado Tres Arroyos:`,
              ...items.map(i => `• ${i.cantidad}x ${i.nombre} — ${formatARS(i.precio * i.cantidad)}`),
              `Subtotal: ${formatARS(sub)}`,
              `Envío: ${formatARS(ship)}`,
              `Total: ${formatARS(tot)}`,
              `Cliente: ${name}`,
              `Barrio: ${barrio}`,
              `Dirección: ${address}`,
              note ? `Nota: ${note}` : ''
            ].filter(Boolean).join('\n');

            if (!firstWhatsAppUrl) {
              firstWhatsAppUrl = buildWhatsAppLink(st.whatsapp, lines);
            }
          });

          db.carrito = [];
          ui.cartOpen = false;
          saveState(db);
          showToast('¡Pedido listo! Abriendo WhatsApp con el detalle.', 'success');
          render();

          if (firstWhatsAppUrl) {
            window.open(firstWhatsAppUrl, '_blank', 'noopener,noreferrer');
          }
        };
      }

      const reg1 = document.getElementById('reg-step-1-form');
      if (reg1) {
        reg1.onsubmit = (e) => {
          e.preventDefault();
          if (!ui.regDraft.nombre.trim() || !ui.regDraft.whatsapp.trim() || !ui.regDraft.email.trim() || !ui.regDraft.password.trim()) {
            showToast('Completá los campos obligatorios del paso 1.', 'error');
            return;
          }
          ui.regStep = 2;
          render();
        };
      }

      const reg2 = document.getElementById('reg-step-2-form');
      if (reg2) {
        reg2.onsubmit = (e) => {
          e.preventDefault();
          ui.regStep = 3;
          render();
        };
      }

      const reg3 = document.getElementById('reg-step-3-form');
      if (reg3) {
        reg3.onsubmit = (e) => {
          e.preventDefault();
          const d = ui.regDraft;
          if (!d.prodNombre.trim() || !(Number(d.prodPrecio) > 0)) {
            showToast('Completá el nombre y precio de tu primer producto.', 'error');
            return;
          }

          const storeId = 'tienda-' + Date.now();
          const slugBase = slugify(d.nombre);
          const uniqueSlug = db.tiendas.some(t => t.slug === slugBase) ? `${slugBase}-${Math.floor(10 + Math.random() * 89)}` : slugBase;
          const todayISO = new Date().toISOString().split('T')[0];

          const newStore = {
            id: storeId,
            slug: uniqueSlug,
            nombre: d.nombre.trim().toUpperCase(),
            dueno: d.nombre.trim(),
            email: d.email.trim(),
            password: d.password,
            rubro: d.rubro,
            barrio: d.barrio,
            direccion: d.barrio,
            whatsapp: d.whatsapp.trim(),
            instagram: '',
            logo: d.logo || makeSvgFallbackDataUri(d.nombre.trim(), '#1A2A44'),
            portada: d.portada || makeSvgFallbackDataUri(d.nombre.trim(), '#2E7D32'),
            descripcion: d.descripcion.trim() || `Tienda de ${d.rubro} en ${d.barrio}, Tres Arroyos.`,
            antiguedadTexto: 'Nueva tienda en Tres Arroyos',
            rating: 5.0,
            reviewCount: 0,
            fiveStarCount: 0,
            salesCount: 1,
            verificado: false,
            abiertoAhora: true,
            horarioTexto: d.horarioTexto || 'Lun a Sáb 9 a 20',
            haceEnvios: Boolean(d.haceEnvios),
            envioHoy: Boolean(d.haceEnvios),
            precioEnvio: Number(d.precioEnvio) || 1500,
            envioGratisDesde: 0,
            aceptaEncargo: false,
            metodosPago: ['Efectivo', 'Transferencia'],
            estadoSuscripcion: 'ACTIVA',
            fechaRegistro: todayISO,
            horariosSemana: makeDefaultHours('09:00', '20:00', false)
          };

          const firstProd = {
            id: 'prod-' + Date.now(),
            tiendaId: storeId,
            nombre: d.prodNombre.trim(),
            precio: Number(d.prodPrecio),
            precioOferta: null,
            esNuevo: true,
            stockDisponible: true,
            cantidadStock: null,
            categoria: d.rubro,
            descripcion: `Producto destacado de ${newStore.nombre}.`,
            fotos: [d.prodFoto || makeSvgFallbackDataUri(d.prodNombre.trim(), '#1A2A44')]
          };

          db.tiendas.unshift(newStore);
          db.productos.unshift(firstProd);
          ui.session = { role: 'VENDOR', storeId };
          ui.regStep = 1;
          ui.regDraft = {
            nombre: '',
            rubro: 'Dulces',
            barrio: 'Centro',
            whatsapp: '',
            email: '',
            password: '',
            logo: '',
            portada: '',
            descripcion: '',
            horarioTexto: 'Lun a Sáb 9 a 20',
            haceEnvios: true,
            precioEnvio: 1500,
            prodNombre: '',
            prodPrecio: 10000,
            prodFoto: ''
          };

          saveState(db);
          pushToSheet('registerStore', { tienda: newStore, productoInicial: firstProd });
          showToast('¡Tu tienda ya está publicada!', 'success');
          navigate('PANEL_TIENDA', { vendorTab: 'MI_TIENDA' });
        };
      }

      const vendorStoreForm = document.getElementById('vendor-store-form');
      if (vendorStoreForm) {
        vendorStoreForm.onsubmit = (e) => {
          e.preventDefault();
          const currentStore = (ui.session && ui.session.storeId) ? getStoreById(ui.session.storeId) : getStoreById(DEMO_TEMPLATE_ID);
          if (!currentStore) return;

          const newName = (document.getElementById('v-store-name')?.value || currentStore.nombre).trim().toUpperCase();
          const newRubro = document.getElementById('v-store-rubro')?.value || currentStore.rubro;
          const newEmail = (document.getElementById('v-store-email')?.value || currentStore.email || '').trim();
          const newPass = document.getElementById('v-store-password')?.value || currentStore.password || '';
          const newDesc = (document.getElementById('v-store-desc')?.value || '').trim();
          const newBarrio = document.getElementById('v-store-barrio')?.value || currentStore.barrio;
          const newDir = (document.getElementById('v-store-dir')?.value || '').trim();
          const newWa = (document.getElementById('v-store-wa')?.value || '').trim();
          const newIg = (document.getElementById('v-store-ig')?.value || '').trim();
          const newHoursText = (document.getElementById('v-store-hours-text')?.value || '').trim();
          const newShip = Boolean(document.getElementById('v-store-shipping')?.checked);
          const newShipPrice = Number(document.getElementById('v-store-ship-price')?.value) || 0;
          const newShipFree = Number(document.getElementById('v-store-ship-free')?.value) || 0;
          const newEncargo = Boolean(document.getElementById('v-store-encargo')?.checked);

          const payMethods = [];
          vendorStoreForm.querySelectorAll('[data-pay-method]').forEach(chk => {
            if (chk.checked) payMethods.push(chk.getAttribute('data-pay-method'));
          });

          const hoursMap = {};
          ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'].forEach(day => {
            const openEl = vendorStoreForm.querySelector(`[data-day-open="${day}"]`);
            const startEl = vendorStoreForm.querySelector(`[data-day-start="${day}"]`);
            const endEl = vendorStoreForm.querySelector(`[data-day-end="${day}"]`);
            hoursMap[day] = {
              abierto: Boolean(openEl && openEl.checked),
              apertura: startEl ? startEl.value : '09:00',
              cierre: endEl ? endEl.value : '20:00'
            };
          });

          const updatedFields = {
            nombre: newName,
            rubro: newRubro,
            email: newEmail,
            password: newPass,
            descripcion: newDesc,
            barrio: newBarrio,
            direccion: newDir,
            whatsapp: newWa,
            instagram: newIg,
            horarioTexto: newHoursText,
            haceEnvios: newShip,
            envioHoy: newShip,
            precioEnvio: newShipPrice,
            envioGratisDesde: newShipFree,
            aceptaEncargo: newEncargo,
            metodosPago: payMethods.length > 0 ? payMethods : ['Efectivo'],
            horariosSemana: hoursMap
          };

          if (isTemplateStore(currentStore)) {
            const result = materializeOwnStoreFromTemplate(currentStore, updatedFields);
            if (result.cloned) {
              showToast('¡Listo! Se guardó como tu tienda propia y la plantilla guía quedó intacta.', 'success');
              render();
              return;
            }
          }

          Object.assign(currentStore, updatedFields);
          saveState(db);
          pushToSheet('updateStore', { tienda: currentStore });
          showToast('¡Cambios guardados!', 'success');
          render();
        };
      }

      const vendorProdForm = document.getElementById('vendor-product-form');
      if (vendorProdForm) {
        vendorProdForm.onsubmit = (e) => {
          e.preventDefault();
          const currentStore = (ui.session && ui.session.storeId) ? getStoreById(ui.session.storeId) : getStoreById(DEMO_TEMPLATE_ID);
          if (!currentStore || !ui.productFormDraft) return;

          const nameVal = (document.getElementById('prod-name-input')?.value || ui.productFormDraft.nombre || '').trim();
          const priceVal = Number(document.getElementById('prod-price-input')?.value || ui.productFormDraft.precio || 0);
          const rawOfferVal = document.getElementById('prod-offer-input')?.value;
          const offerVal = rawOfferVal && Number(rawOfferVal) > 0 ? Number(rawOfferVal) : null;

          if (!nameVal || !(priceVal > 0)) {
            showToast('Completá el nombre y precio del producto.', 'error');
            return;
          }
          if (offerVal !== null && offerVal >= priceVal) {
            showToast('El precio de oferta debe ser menor al precio normal.', 'error');
            return;
          }

          const isEdit = Boolean(ui.productFormDraft.id);
          const prodId = ui.productFormDraft.id || ('prod-' + Date.now());
          const fotosArr = (ui.productFormDraft.fotos && ui.productFormDraft.fotos.length > 0)
            ? ui.productFormDraft.fotos.slice(0, 3)
            : [makeSvgFallbackDataUri(nameVal, '#1A2A44')];

          const newProdObj = {
            id: prodId,
            tiendaId: currentStore.id,
            nombre: nameVal,
            precio: priceVal,
            precioOferta: offerVal,
            esNuevo: Boolean(ui.productFormDraft.esNuevo),
            stockDisponible: Boolean(ui.productFormDraft.stockDisponible),
            cantidadStock: ui.productFormDraft.cantidadStock !== undefined && ui.productFormDraft.cantidadStock !== null && ui.productFormDraft.cantidadStock !== ''
              ? Number(ui.productFormDraft.cantidadStock)
              : null,
            categoria: ui.productFormDraft.categoria || currentStore.rubro,
            descripcion: (ui.productFormDraft.descripcion || '').trim(),
            fotos: fotosArr
          };

          if (isEdit) {
            const idx = db.productos.findIndex(p => p.id === prodId);
            if (idx !== -1) db.productos[idx] = newProdObj;
          } else {
            db.productos.unshift(newProdObj);
          }

          db.ofertas = db.ofertas.filter(o => o.productoId !== prodId);
          if (offerVal !== null) {
            db.ofertas.unshift({
              id: 'of-' + Date.now(),
              productoId: prodId,
              precioOferta: offerVal,
              hastaCuando: Date.now() + 4 * 60 * 60 * 1000,
              destacada: false
            });
          }

          ui.showProductForm = false;
          ui.productFormDraft = null;
          saveState(db);
          pushToSheet('saveProduct', newProdObj);
          showToast(isEdit ? 'Producto actualizado.' : '¡Producto guardado!', 'success');
          render();
        };
      }

      const loginForm = document.getElementById('login-modal-form');
      if (loginForm) {
        loginForm.onsubmit = (e) => {
          e.preventDefault();
          const emailVal = (document.getElementById('login-email-input')?.value || '').trim().toLowerCase();
          const passVal = (document.getElementById('login-pass-input')?.value || '').trim();

          if (emailVal === 'admin@tresarroyos.com' || emailVal === 'admin') {
            ui.session = { role: 'ADMIN' };
            closeModal();
            showToast('Bienvenido al Panel Admin.', 'success');
            navigate('PANEL_ADMIN');
            return;
          }

          const matchedStore = db.tiendas.find(t =>
            (t.email || '').toLowerCase() === emailVal && String(t.password || '') === passVal
          );

          if (matchedStore) {
            ui.session = { role: 'VENDOR', storeId: matchedStore.id };
            closeModal();
            showToast(`Ingresaste como ${matchedStore.nombre}.`, 'success');
            navigate('PANEL_TIENDA', { vendorTab: 'MI_TIENDA' });
          } else {
            showToast('Credenciales no encontradas. Probá con la plantilla guía o una tienda demo.', 'error');
          }
        };
      }

      const reviewForm = document.getElementById('review-modal-form');
      if (reviewForm) {
        reviewForm.onsubmit = async (e) => {
          e.preventDefault();
          const storeId = reviewForm.getAttribute('data-store-id');
          const clientName = (document.getElementById('rev-client-name')?.value || '').trim();
          const stars = Number(document.getElementById('rev-stars')?.value) || 5;
          const comment = (document.getElementById('rev-comment')?.value || '').trim();
          const fileInput = document.getElementById('rev-photo-file');

          if (!clientName || !comment) {
            showToast('Completá tu nombre y comentario.', 'error');
            return;
          }

          let photoData = '';
          if (fileInput && fileInput.files && fileInput.files[0]) {
            try {
              photoData = await readImageFileAsDataUrl(fileInput.files[0]);
            } catch (_) {}
          }

          const newRev = {
            id: 'rev-' + Date.now(),
            tiendaId: storeId,
            cliente: clientName,
            avatar: makeSvgFallbackDataUri(clientName, '#1A2A44'),
            fecha: 'Hoy',
            estrellas: stars,
            comentario: comment,
            fotoProducto: photoData
          };

          db.resenas.unshift(newRev);
          const st = getStoreById(storeId);
          if (st) {
            st.reviewCount = (st.reviewCount || 0) + 1;
            if (stars === 5) st.fiveStarCount = (st.fiveStarCount || 0) + 1;
          }

          saveState(db);
          pushToSheet('createReview', newRev);
          closeModal();
          showToast('¡Gracias por tu reseña!', 'success');
          render();
        };
      }

      const reportForm = document.getElementById('report-store-form');
      if (reportForm) {
        reportForm.onsubmit = (e) => {
          e.preventDefault();
          closeModal();
          showToast('Reporte enviado. Gracias por ayudar a cuidar la comunidad.', 'info');
        };
      }
    }

    // Acciones expuestas para onclick
    window.__quickDemoLogin = function (email, password) {
      const st = db.tiendas.find(t => (t.email || '').toLowerCase() === String(email).toLowerCase() && String(t.password) === String(password));
      if (!st) return;
      ui.session = { role: 'VENDOR', storeId: st.id };
      closeModal();
      showToast(`Ingresaste a ${st.nombre}.`, 'success');
      navigate('PANEL_TIENDA', { vendorTab: 'MI_TIENDA' });
    };

    window.__openDemoTemplateAsVendor = function () {
      ensureDemoTemplateExists();
      const tpl = getStoreById(DEMO_TEMPLATE_ID);
      if (!tpl) return;
      ui.session = { role: 'VENDOR', storeId: DEMO_TEMPLATE_ID };
      ui.showProductForm = false;
      ui.productFormDraft = null;
      showToast('Abriste la tienda plantilla guía. Editá tus datos y cambiá email/contraseña al guardar.', 'info');
      navigate('PANEL_TIENDA', { vendorTab: 'MI_TIENDA' });
    };

    window.__vendorToggleOpen = function (storeId) {
      const st = getStoreById(storeId);
      if (!st) return;
      st.abiertoAhora = !st.abiertoAhora;
      saveState(db);
      pushToSheet('updateStore', { tienda: st });
      showToast(st.abiertoAhora ? 'Tu tienda ahora figura ABIERTA.' : 'Tu tienda ahora figura CERRADA.', 'info');
      render();
    };

    window.__vendorUploadStoreMedia = async function (event, field) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const st = (ui.session && ui.session.storeId) ? getStoreById(ui.session.storeId) : getStoreById(DEMO_TEMPLATE_ID);
      if (!st) return;
      try {
        const dataUrl = await readImageFileAsDataUrl(file);
        st[field] = dataUrl;
        saveState(db);
        pushToSheet('updateStore', { tienda: st });
        showToast(field === 'logo' ? 'Logo actualizado desde tu galería.' : 'Portada actualizada desde tu galería.', 'success');
        render();
      } catch (err) {
        showToast(err.message || 'No se pudo cargar la foto.', 'error');
      }
    };

    window.__vendorClearStoreMedia = function (field) {
      const st = (ui.session && ui.session.storeId) ? getStoreById(ui.session.storeId) : getStoreById(DEMO_TEMPLATE_ID);
      if (!st) return;
      st[field] = field === 'logo'
        ? makeSvgFallbackDataUri(st.nombre, '#1A2A44')
        : makeSvgFallbackDataUri(st.nombre, '#2E7D32');
      saveState(db);
      pushToSheet('updateStore', { tienda: st });
      showToast('Foto restablecida.', 'info');
      render();
    };

    window.__vendorCopyFirstDayHours = function () {
      const st = (ui.session && ui.session.storeId) ? getStoreById(ui.session.storeId) : getStoreById(DEMO_TEMPLATE_ID);
      if (!st || !st.horariosSemana) return;
      const mon = st.horariosSemana['Lunes'] || { abierto: true, apertura: '09:00', cierre: '20:00' };
      ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'].forEach(d => {
        st.horariosSemana[d] = { ...mon };
      });
      saveState(db);
      pushToSheet('updateStore', { tienda: st });
      showToast('Horario del lunes copiado a todos los días.', 'success');
      render();
    };

    window.__vendorOpenNewProductForm = function (storeId) {
      const st = getStoreById(storeId) || getStoreById(DEMO_TEMPLATE_ID) || db.tiendas[0];
      ui.productFormDraft = {
        id: null,
        tiendaId: st.id,
        nombre: '',
        precio: 10000,
        precioOferta: null,
        esNuevo: true,
        stockDisponible: true,
        cantidadStock: null,
        categoria: st.rubro || 'Otros',
        descripcion: '',
        fotos: [makeSvgFallbackDataUri('Producto local', '#1A2A44')]
      };
      ui.showProductForm = true;
      render();
    };

    window.__vendorEditProduct = function (productId) {
      const prod = db.productos.find(p => p.id === productId);
      if (!prod) return;
      ui.productFormDraft = {
        ...prod,
        fotos: Array.isArray(prod.fotos) ? [...prod.fotos] : [SAMPLE_FALLBACK_PHOTO]
      };
      ui.showProductForm = true;
      render();
    };

    window.__vendorUploadProductPhotos = async function (event) {
      if (!ui.productFormDraft) return;
      const files = Array.from(event.target.files || []);
      if (files.length === 0) return;

      const currentPhotos = Array.isArray(ui.productFormDraft.fotos) ? [...ui.productFormDraft.fotos] : [];
      const hasPlaceholderOnly = currentPhotos.length === 1 && String(currentPhotos[0] || '').startsWith('data:image/svg+xml');
      const baseList = hasPlaceholderOnly ? [] : currentPhotos;

      for (const file of files) {
        if (baseList.length >= 3) break;
        try {
          const dataUrl = await readImageFileAsDataUrl(file);
          baseList.push(dataUrl);
        } catch (_) {}
      }

      ui.productFormDraft.fotos = baseList.slice(0, 3);
      showToast('Fotos agregadas al producto.', 'success');
      render();
    };

    window.__vendorRemoveProductPhoto = function (index) {
      if (!ui.productFormDraft || !Array.isArray(ui.productFormDraft.fotos)) return;
      ui.productFormDraft.fotos.splice(index, 1);
      if (ui.productFormDraft.fotos.length === 0) {
        ui.productFormDraft.fotos = [makeSvgFallbackDataUri(ui.productFormDraft.nombre || 'Producto', '#1A2A44')];
      }
      render();
    };

    window.__vendorMoveProductPhoto = function (index, delta) {
      if (!ui.productFormDraft || !Array.isArray(ui.productFormDraft.fotos)) return;
      const target = index + delta;
      if (target < 0 || target >= ui.productFormDraft.fotos.length) return;
      const arr = ui.productFormDraft.fotos;
      const temp = arr[index];
      arr[index] = arr[target];
      arr[target] = temp;
      render();
    };

    window.__vendorToggleProductOffer = function (productId) {
      const prod = db.productos.find(p => p.id === productId);
      if (!prod) return;
      const pricing = getEffectivePrice(prod);
      if (pricing.hasOffer) {
        prod.precioOferta = null;
        db.ofertas = db.ofertas.filter(o => o.productoId !== productId);
        showToast('Oferta quitada.', 'info');
      } else {
        const suggested = Math.max(100, Math.round(prod.precio * 0.85));
        prod.precioOferta = suggested;
        db.ofertas = db.ofertas.filter(o => o.productoId !== productId);
        db.ofertas.unshift({
          id: 'of-' + Date.now(),
          productoId: productId,
          precioOferta: suggested,
          hastaCuando: Date.now() + 4 * 60 * 60 * 1000,
          destacada: false
        });
        showToast(`Oferta activada a ${formatARS(suggested)}.`, 'success');
      }
      saveState(db);
      pushToSheet('saveProduct', prod);
      render();
    };

    window.__vendorDuplicateProduct = function (productId) {
      const prod = db.productos.find(p => p.id === productId);
      if (!prod) return;
      const copy = {
        ...prod,
        id: 'prod-' + Date.now(),
        nombre: prod.nombre + ' (copia)',
        fotos: Array.isArray(prod.fotos) ? [...prod.fotos] : [SAMPLE_FALLBACK_PHOTO]
      };
      db.productos.unshift(copy);
      saveState(db);
      pushToSheet('saveProduct', copy);
      showToast('Producto duplicado.', 'success');
      render();
    };

    window.__vendorAskDeleteProduct = function (productId) {
      const prod = db.productos.find(p => p.id === productId);
      if (!prod) return;
      showModal(`
        <div class="p-6 space-y-4">
          <h3 class="font-extrabold text-lg text-[#111111]">¿Borrar "${escapeHtml(prod.nombre)}"?</h3>
          <p class="text-sm text-[#666666]">Esta acción eliminará el producto de tu catálogo.</p>
          <div class="flex items-center justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="min-h-[44px] px-4 py-2 rounded-xl bg-slate-100 font-bold text-xs">Cancelar</button>
            <button type="button" onclick="window.__vendorConfirmDeleteProduct('${productId}')" class="min-h-[44px] px-4 py-2 rounded-xl bg-[#E53935] text-white font-bold text-xs">Borrar</button>
          </div>
        </div>
      `);
    };

    window.__vendorConfirmDeleteProduct = function (productId) {
      db.productos = db.productos.filter(p => p.id !== productId);
      db.ofertas = db.ofertas.filter(o => o.productoId !== productId);
      saveState(db);
      pushToSheet('deleteProduct', { id: productId });
      closeModal();
      showToast('Producto borrado.', 'info');
      render();
    };

    window.__vendorMoveProduct = function (productId, delta) {
      const idx = db.productos.findIndex(p => p.id === productId);
      if (idx === -1) return;
      const target = idx + delta;
      if (target < 0 || target >= db.productos.length) return;
      const temp = db.productos[idx];
      db.productos[idx] = db.productos[target];
      db.productos[target] = temp;
      saveState(db);
      render();
    };

    window.__vendorSetOrderStatus = function (orderId, newStatus) {
      const ord = db.pedidos.find(o => o.id === orderId);
      if (!ord) return;
      ord.estado = newStatus;
      ord.esNuevoNoVisto = false;
      saveState(db);
      pushToSheet('updateOrderStatus', { id: orderId, estado: newStatus });
      showToast(`Pedido marcado como ${newStatus}.`, 'success');
      render();
    };

    window.__vendorMarkAllOrdersSeen = function (storeId) {
      db.pedidos.forEach(o => {
        if (o.tiendaId === storeId) o.esNuevoNoVisto = false;
      });
      saveState(db);
      render();
    };

    window.__adminSetStoreStatus = function (storeId, status) {
      const st = getStoreById(storeId);
      if (!st) return;
      st.estadoSuscripcion = status;
      saveState(db);
      pushToSheet('updateStoreStatus', { id: storeId, estadoSuscripcion: status });
      showToast(`Estado de ${st.nombre}: ${status}.`, 'success');
      render();
    };

    window.__adminToggleVerified = function (storeId) {
      const st = getStoreById(storeId);
      if (!st) return;
      st.verificado = !st.verificado;
      saveState(db);
      pushToSheet('updateStore', { tienda: st });
      showToast(st.verificado ? 'Sello Verificado activado.' : 'Sello Verificado quitado.', 'info');
      render();
    };

    window.__adminDeleteSampleStores = function () {
      const demoIds = ['tienda-don-juan', 'tienda-luna', 'tienda-huellas', 'tienda-deco-hogar'];
      db.tiendas = db.tiendas.filter(t => !demoIds.includes(t.id));
      db.productos = db.productos.filter(p => !demoIds.includes(p.tiendaId));
      saveState(db);
      showToast('Tiendas de ejemplo eliminadas.', 'info');
      render();
    };

    window.__adminFeatureOffer = function (offerId) {
      db.ofertas.forEach(o => {
        o.destacada = (o.id === offerId);
      });
      saveState(db);
      showToast('Oferta destacada.', 'success');
      render();
    };

    window.__adminEndOffer = function (offerId) {
      const off = db.ofertas.find(o => o.id === offerId);
      if (off) {
        const prod = db.productos.find(p => p.id === off.productoId);
        if (prod) {
          prod.precioOferta = null;
          pushToSheet('saveProduct', prod);
        }
      }
      db.ofertas = db.ofertas.filter(o => o.id !== offerId);
      saveState(db);
      showToast('Oferta finalizada.', 'info');
      render();
    };

    // RENDER PRINCIPAL
    function render() {
      ensureDemoTemplateExists();
      const appEl = document.getElementById('app');
      if (!appEl) return;

      let screenHtml = '';
      switch (ui.route) {
        case 'TIENDAS':
          screenHtml = renderStoresDirectory();
          break;
        case 'OFERTAS':
          screenHtml = renderOffersPage();
          break;
        case 'QUIERO_VENDER':
          screenHtml = renderRegisterStoreWizard();
          break;
        case 'TIENDA_PERFIL':
          screenHtml = renderStoreProfile();
          break;
        case 'PANEL_TIENDA':
          screenHtml = renderVendorPanel();
          break;
        case 'PANEL_ADMIN':
          screenHtml = renderAdminPanel();
          break;
        case 'INICIO':
        default:
          screenHtml = renderHome();
          break;
      }

      appEl.innerHTML = `
        ${renderHeader()}
        ${screenHtml}
        ${renderFooter()}
        ${renderFloatingCartButton()}
        ${renderCartDrawer()}
      `;

      attachGlobalEvents();
    }

    render();
    fetchSheetDataOnLoad();
  </script>
</body>
</html>
