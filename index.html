    function bindPostRenderEvents() {
      const cartForm = document.getElementById('cart-checkout-form');
      if (cartForm) {
        cartForm.addEventListener('submit', (e) => {
          e.preventDefault();
          if (db.carrito.length === 0) return;

          const customerName = String(document.getElementById('cart-customer-name').value || '').trim();
          const customerBarrio = String(document.getElementById('cart-customer-barrio').value || 'Centro').trim();
          const customerAddress = String(document.getElementById('cart-customer-address').value || '').trim();
          const customerNote = String(document.getElementById('cart-customer-note').value || '').trim();

          if (!customerName || !customerAddress) {
            showToast('Completá tu nombre y dirección para enviar el pedido.', 'error');
            return;
          }

          const byStore = new Map();
          db.carrito.forEach(item => {
            if (!byStore.has(item.tiendaId)) byStore.set(item.tiendaId, []);
            byStore.get(item.tiendaId).push(item);
          });

          const firstStoreEntry = Array.from(byStore.entries())[0];
          const [firstStoreId, firstItems] = firstStoreEntry;
          const firstStore = getStoreById(firstStoreId) || { nombre: 'Tienda', whatsapp: SUPPORT_WHATSAPP, haceEnvios: true, precioEnvio: 1500 };

          byStore.forEach((items, storeId) => {
            const st = getStoreById(storeId) || { nombre: 'Tienda', whatsapp: SUPPORT_WHATSAPP, haceEnvios: true, precioEnvio: 1500 };
            const sub = items.reduce((s, it) => s + it.precio * it.cantidad, 0);
            const ship = st.haceEnvios ? ((st.envioGratisDesde && sub >= st.envioGratisDesde) ? 0 : (Number(st.precioEnvio) || 0)) : 0;
            const total = sub + ship;
            const orderId = 'PED-' + Math.floor(1000 + Math.random() * 9000);

            const newOrder = {
              id: orderId,
              tiendaId: storeId,
              tiendaNombre: st.nombre,
              cliente: customerName,
              barrio: customerBarrio,
              direccion: customerAddress,
              nota: customerNote,
              fecha: 'Hoy ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }),
              estado: 'Nuevo',
              esNuevoNoVisto: true,
              total,
              items: items.map(it => ({
                productoId: it.productoId,
                nombre: it.nombre,
                cantidad: it.cantidad,
                precioUnitario: it.precio,
                foto: it.foto
              }))
            };

            db.pedidos.unshift(newOrder);
            syncOrderToSheet(newOrder);

            db.misPedidosCliente.unshift({
              id: orderId,
              tiendaId: storeId,
              tiendaNombre: st.nombre,
              total,
              resumenItems: items.map(it => `${it.cantidad}x ${it.nombre}`).join(', '),
              items: items.map(it => ({ productoId: it.productoId, cantidad: it.cantidad }))
            });
          });

          const subFirst = firstItems.reduce((s, it) => s + it.precio * it.cantidad, 0);
          const shipFirst = firstStore.haceEnvios ? ((firstStore.envioGratisDesde && subFirst >= firstStore.envioGratisDesde) ? 0 : (Number(firstStore.precioEnvio) || 0)) : 0;
          const totalFirst = subFirst + shipFirst;
          const lines = firstItems.map(it => `- ${it.cantidad}x ${it.nombre} (${formatARS(it.precio * it.cantidad)})`).join('\n');
          const waMessage = `Hola ${firstStore.nombre}, te paso mi pedido de Mercado Tres Arroyos:\n\n${lines}\n\nSubtotal: ${formatARS(subFirst)}\nEnvío: ${formatARS(shipFirst)}\nTotal: ${formatARS(totalFirst)}\n\nNombre: ${customerName}\nDirección: ${customerAddress} (${customerBarrio})${customerNote ? `\nNota: ${customerNote}` : ''}`;

          db.carrito = [];
          saveState(db);
          ui.cartOpen = false;
          render();
          showToast('¡Pedido registrado! Abriendo WhatsApp...', 'success');
          openWhatsAppUrl(firstStore.whatsapp, waMessage);
        });
      }

      const reg1 = document.getElementById('reg-step-1-form');
      if (reg1) {
        reg1.addEventListener('submit', (e) => {
          e.preventDefault();
          if (!ui.regDraft.nombre.trim() || !ui.regDraft.whatsapp.trim() || !ui.regDraft.email.trim() || !ui.regDraft.password.trim()) {
            showToast('Completá todos los campos obligatorios.', 'error');
            return;
          }
          ui.regStep = 2;
          render();
        });
      }

      const reg2 = document.getElementById('reg-step-2-form');
      if (reg2) {
        reg2.addEventListener('submit', (e) => {
          e.preventDefault();
          ui.regStep = 3;
          render();
        });
      }

      const reg3 = document.getElementById('reg-step-3-form');
      if (reg3) {
        reg3.addEventListener('submit', (e) => {
          e.preventDefault();
          const d = ui.regDraft;
          if (!d.prodNombre.trim() || !(Number(d.prodPrecio) > 0)) {
            showToast('Completá el nombre y precio de tu primer producto.', 'error');
            return;
          }

          const newStoreId = 'tienda-' + Date.now();
          const baseSlug = slugify(d.nombre);
          const uniqueSlug = db.tiendas.some(t => t.slug === baseSlug) ? `${baseSlug}-${Math.floor(10 + Math.random() * 89)}` : baseSlug;
          const todayISO = new Date().toISOString().split('T')[0];

          const newStore = {
            id: newStoreId,
            slug: uniqueSlug,
            nombre: d.nombre.trim().toUpperCase(),
            dueno: d.nombre.trim(),
            email: d.email.trim().toLowerCase(),
            password: d.password.trim(),
            rubro: d.rubro,
            barrio: d.barrio,
            direccion: d.barrio + ', Tres Arroyos',
            whatsapp: normalizeWhatsAppPhone(d.whatsapp),
            instagram: '',
            logo: d.logo || makeSvgFallbackDataUri(d.nombre, '#1A2A44'),
            portada: d.portada || makeSvgFallbackDataUri(d.nombre, '#2E7D32'),
            descripcion: d.descripcion.trim() || `Tienda local de ${d.rubro} en ${d.barrio}, Tres Arroyos.`,
            antiguedadTexto: 'Nueva en Tres Arroyos',
            rating: 5.0,
            reviewCount: 0,
            fiveStarCount: 0,
            salesCount: 1,
            verificado: false,
            abiertoAhora: true,
            horarioTexto: d.horarioTexto.trim() || 'Lun a Sáb 9 a 20',
            haceEnvios: Boolean(d.haceEnvios),
            envioHoy: Boolean(d.haceEnvios),
            precioEnvio: d.haceEnvios ? 1500 : 0,
            envioGratisDesde: 0,
            aceptaEncargo: true,
            metodosPago: ['Efectivo', 'Transferencia'],
            estadoSuscripcion: 'ACTIVA',
            fechaRegistro: todayISO,
            horariosSemana: makeDefaultHours('09:00', '20:00', false)
          };

          const firstProd = {
            id: 'prod-' + Date.now(),
            tiendaId: newStoreId,
            nombre: d.prodNombre.trim(),
            precio: Number(d.prodPrecio),
            precioOferta: null,
            esNuevo: true,
            stockDisponible: true,
            cantidadStock: 10,
            categoria: d.rubro,
            descripcion: `Producto destacado de ${newStore.nombre}.`,
            fotos: [d.prodFoto || makeSvgFallbackDataUri(d.prodNombre, '#1A2A44')]
          };

          db.tiendas.unshift(newStore);
          db.productos.unshift(firstProd);
          saveState(db);

          syncStoreToSheet(newStore);
          syncProductToSheet(firstProd);

          ui.session = { role: 'VENDOR', storeId: newStoreId };
          ui.regStep = 1;
          ui.regDraft = {
            nombre: '',
            rubro: 'Dulces',
            barrio: 'Centro',
            whatsapp: '',
            email: '',
            password: '',
            logo: '',
            portada: '',
            descripcion: '',
            horarioTexto: 'Lun a Sáb 9 a 20',
            haceEnvios: true,
            precioEnvio: 1500,
            prodNombre: '',
            prodPrecio: 10000,
            prodFoto: ''
          };

          showToast('¡Tu tienda ya está publicada!', 'success');
          navigate('PANEL_TIENDA', { vendorTab: 'MI_TIENDA' });
        });
      }

      const vendorStoreForm = document.getElementById('vendor-store-form');
      if (vendorStoreForm && ui.session) {
        vendorStoreForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const st = getStoreById(ui.session.storeId);
          if (!st) return;

          const newHours = {};
          ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'].forEach(day => {
            newHours[day] = {
              abierto: Boolean(document.querySelector(`[data-day-open="${day}"]`)?.checked),
              apertura: document.querySelector(`[data-day-start="${day}"]`)?.value || '09:00',
              cierre: document.querySelector(`[data-day-end="${day}"]`)?.value || '20:00'
            };
          });

          const payMethods = [];
          document.querySelectorAll('[data-pay-method]').forEach(cb => {
            if (cb.checked) payMethods.push(cb.getAttribute('data-pay-method'));
          });

          const updatedFields = {
            nombre: String(document.getElementById('v-store-name').value || st.nombre).trim(),
            rubro: document.getElementById('v-store-rubro').value || st.rubro,
            email: String(document.getElementById('v-store-email').value || st.email || '').trim().toLowerCase(),
            password: String(document.getElementById('v-store-password').value || st.password || '123456').trim(),
            descripcion: String(document.getElementById('v-store-desc').value || '').trim(),
            barrio: document.getElementById('v-store-barrio').value || st.barrio,
            direccion: String(document.getElementById('v-store-dir').value || '').trim(),
            whatsapp: normalizeWhatsAppPhone(document.getElementById('v-store-wa').value || st.whatsapp),
            instagram: String(document.getElementById('v-store-ig').value || '').trim(),
            horarioTexto: String(document.getElementById('v-store-hours-text').value || '').trim(),
            haceEnvios: Boolean(document.getElementById('v-store-shipping').checked),
            precioEnvio: Number(document.getElementById('v-store-ship-price').value) || 0,
            envioGratisDesde: Number(document.getElementById('v-store-ship-free').value) || 0,
            aceptaEncargo: Boolean(document.getElementById('v-store-encargo').checked),
            metodosPago: payMethods.length > 0 ? payMethods : ['Efectivo'],
            horariosSemana: newHours
          };

          if (isTemplateStore(st)) {
            const result = materializeOwnStoreFromTemplate(st, updatedFields);
            if (result.cloned) {
              showToast(`¡Listo! Se creó tu tienda propia "${result.store.nombre}" con tu email y contraseña.`, 'success');
              render();
              return;
            }
          }

          Object.assign(st, updatedFields);
          saveState(db);
          syncStoreToSheet(st);
          showToast('¡Cambios guardados y sincronizados!', 'success');
          render();
        });
      }

      const vendorProdForm = document.getElementById('vendor-product-form');
      if (vendorProdForm && ui.productFormDraft) {
        vendorProdForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const d = ui.productFormDraft;
          const nameInputEl = document.getElementById('prod-name-input');
          const priceInputEl = document.getElementById('prod-price-input');
          const offerInputEl = document.getElementById('prod-offer-input');
          if (nameInputEl) d.nombre = nameInputEl.value;
          if (priceInputEl) d.precio = Number(priceInputEl.value) || 0;
          if (offerInputEl) d.precioOferta = offerInputEl.value ? Number(offerInputEl.value) : null;

          if (!d.nombre || !d.nombre.trim() || !(Number(d.precio) > 0)) {
            showToast('Completá el nombre y el precio del producto.', 'error');
            return;
          }

          const cleanPhotos = (Array.isArray(d.fotos) && d.fotos.length > 0)
            ? d.fotos.slice(0, 3)
            : [makeSvgFallbackDataUri(d.nombre, '#1A2A44')];

          const offerVal = (d.precioOferta && Number(d.precioOferta) > 0 && Number(d.precioOferta) < Number(d.precio))
            ? Number(d.precioOferta)
            : null;

          if (d.id) {
            const existing = db.productos.find(p => p.id === d.id);
            if (existing) {
              existing.nombre = d.nombre.trim();
              existing.categoria = d.categoria || existing.categoria;
              existing.precio = Number(d.precio);
              existing.precioOferta = offerVal;
              existing.cantidadStock = d.cantidadStock !== null && d.cantidadStock !== '' ? Number(d.cantidadStock) : null;
              existing.descripcion = String(d.descripcion || '').trim();
              existing.stockDisponible = Boolean(d.stockDisponible);
              existing.esNuevo = Boolean(d.esNuevo);
              existing.fotos = cleanPhotos;

              const oldOfferIdx = db.ofertas.findIndex(o => o.productoId === existing.id);
              const removedOffer = oldOfferIdx !== -1 ? db.ofertas[oldOfferIdx] : null;
              if (oldOfferIdx !== -1) db.ofertas.splice(oldOfferIdx, 1);

              if (offerVal) {
                const newOffer = {
                  id: 'of-' + Date.now(),
                  productoId: existing.id,
                  tiendaId: existing.tiendaId,
                  precioOferta: offerVal,
                  hastaCuando: Date.now() + 4 * 60 * 60 * 1000,
                  destacada: false
                };
                db.ofertas.unshift(newOffer);
                syncOfferToSheet(newOffer);
              } else if (removedOffer) {
                syncOfferToSheet(removedOffer, 'delete');
              }

              syncProductToSheet(existing);
            }
          } else {
            const newProd = {
              id: 'prod-' + Date.now(),
              tiendaId: d.tiendaId,
              nombre: d.nombre.trim(),
              categoria: d.categoria || 'Otros',
              precio: Number(d.precio),
              precioOferta: offerVal,
              cantidadStock: d.cantidadStock !== null && d.cantidadStock !== '' ? Number(d.cantidadStock) : null,
              descripcion: String(d.descripcion || '').trim(),
              stockDisponible: Boolean(d.stockDisponible),
              esNuevo: Boolean(d.esNuevo),
              fotos: cleanPhotos
            };
            db.productos.unshift(newProd);
            if (offerVal) {
              const newOffer = {
                id: 'of-' + Date.now(),
                productoId: newProd.id,
                tiendaId: newProd.tiendaId,
                precioOferta: offerVal,
                hastaCuando: Date.now() + 4 * 60 * 60 * 1000,
                destacada: false
              };
              db.ofertas.unshift(newOffer);
              syncOfferToSheet(newOffer);
            }
            syncProductToSheet(newProd);
          }

          saveState(db);
          ui.showProductForm = false;
          ui.productFormDraft = null;
          showToast('¡Producto guardado y sincronizado!', 'success');
          render();
        });
      }
    }

    function renderFooter() {
      const supportWaMsg = 'Hola Mercado Tres Arroyos, necesito ayuda.';
      return `
        <footer class="bg-[#1A2A44] text-white mt-auto border-t border-slate-800">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 py-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 text-sm">
            <div>
              <div class="font-extrabold text-lg tracking-tight">MERCADO TRES ARROYOS</div>
              <p class="mt-2 text-white/75 text-xs leading-relaxed">
                Comprá local. Todo Tres Arroyos en un solo lugar.
              </p>
            </div>

            <div>
              <div class="font-extrabold text-xs uppercase tracking-wider text-white/60 mb-3">Compradores</div>
              <ul class="space-y-2 text-xs font-semibold">
                <li><button type="button" onclick="navigate('INICIO')" class="hover:underline">Inicio</button></li>
                <li><button type="button" onclick="navigate('TIENDAS')" class="hover:underline">Tiendas</button></li>
                <li><button type="button" onclick="navigate('OFERTAS')" class="hover:underline">Ofertas del día</button></li>
                <li><button type="button" onclick="ui.cartOpen = true; render();" class="hover:underline">Tu pedido</button></li>
              </ul>
            </div>

            <div>
              <div class="font-extrabold text-xs uppercase tracking-wider text-white/60 mb-3">Emprendedores</div>
              <ul class="space-y-2 text-xs font-semibold">
                <li><button type="button" onclick="navigate('QUIERO_VENDER')" class="hover:underline">Abrir mi tienda</button></li>
                <li><button type="button" onclick="openLoginModal()" class="hover:underline">Ingresar a mi tienda</button></li>
              </ul>
            </div>

            <div>
              <div class="font-extrabold text-xs uppercase tracking-wider text-white/60 mb-3">Ayuda y contacto</div>
              <button type="button" onclick="openWhatsAppUrl('${SUPPORT_WHATSAPP}', '${escapeHtml(supportWaMsg)}')" class="min-h-[44px] px-4 py-2 rounded-xl bg-[#25D366] hover:bg-[#1EB956] text-white font-bold text-xs inline-flex items-center gap-1.5">
                <span>💬 WhatsApp soporte</span>
              </button>
              <div class="mt-3 text-xs text-white/60">Tres Arroyos, Buenos Aires, Argentina.</div>
            </div>
          </div>
          <div class="border-t border-white/10 py-4 px-4 sm:px-6 text-center text-xs text-white/50 flex items-center justify-center gap-2">
            <span>© ${new Date().getFullYear()} Mercado Tres Arroyos</span>
            <a href="admin.html" title="Administración" aria-label="Administración" class="text-[11px] text-white/25 hover:text-white/50 transition-colors leading-none">⚙️</a>
          </div>
        </footer>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      let contentHtml = '';
      if (ui.route === 'INICIO') {
        contentHtml = renderHome();
      } else if (ui.route === 'TIENDAS') {
        contentHtml = renderStoresDirectory();
      } else if (ui.route === 'OFERTAS') {
        contentHtml = renderOffersPage();
      } else if (ui.route === 'QUIERO_VENDER') {
        contentHtml = renderRegisterStoreWizard();
      } else if (ui.route === 'TIENDA_PERFIL') {
        contentHtml = renderStoreProfile();
      } else if (ui.route === 'PANEL_TIENDA') {
        contentHtml = renderVendorPanel();
      } else {
        contentHtml = renderHome();
      }

      app.innerHTML = `
        ${renderHeader()}
        ${contentHtml}
        ${renderFloatingCartButton()}
        ${renderCartDrawer()}
        ${renderFooter()}
      `;

      bindPostRenderEvents();
    }

    document.addEventListener('DOMContentLoaded', () => {
      render();
      fetchSheetDataOnLoad(false);
    });
  </script>
</body>
</html>
